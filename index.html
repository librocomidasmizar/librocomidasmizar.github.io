<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libro de comidas - Mizar</title>
<meta name="theme-color" content="#2E5E4E">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mizar">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --ink:#1C2621; --muted:#58685F; --line:#D2DCD5;
  --primary:#2E5E4E; --primary-ink:#FFFFFF; --soft:#DFEBE3;
  --accent:#B9791A; --accent-soft:#F5E8CF; --danger:#A23B2C; --danger-soft:#F6DED9; --cena:#4767A8;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --head:"Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111714; --surface:#19211D; --ink:#E4ECE7; --muted:#9BAAA1; --line:#2B3731;
    --primary:#80C2A7; --primary-ink:#0E1A15; --soft:#21302A;
    --accent:#E2B357; --accent-soft:#3A301E; --danger:#E7897A; --danger-soft:#3B221E; --cena:#93B2EC;
  }
}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211D; --ink:#E4ECE7; --muted:#9BAAA1; --line:#2B3731;
  --primary:#80C2A7; --primary-ink:#0E1A15; --soft:#21302A;
  --accent:#E2B357; --accent-soft:#3A301E; --danger:#E7897A; --danger-soft:#3B221E; --cena:#93B2EC;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body{-webkit-tap-highlight-color:transparent}
.seg,.bnav,.hoja,.cal,.days .day-head{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 110px}
/* Barra de navegación inferior */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(0,0,0,.08);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav-in{display:flex;max-width:760px;margin:0 auto}
.bn{flex:1 1 0;min-width:0;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;color:var(--muted);font-size:12px;font-weight:700;position:relative;line-height:1.15;text-align:center}
.bn .ico{display:grid;place-items:center;width:58px;height:32px;border-radius:999px}
.bn svg{width:24px;height:24px}
.bn[aria-current="true"]{color:var(--primary)}
.bn[aria-current="true"] .ico{background:var(--soft)}
.bn .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0}
.velo{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:18}
.hoja{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:19;padding:0 10px}
.hoja-in{max-width:740px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.hoja-t{font-family:var(--head);font-weight:600;font-size:15px;color:var(--muted);margin:0 4px 10px}
.hoja-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hb{background:var(--bg);border:2px solid transparent;border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13.5px;color:var(--ink);position:relative;text-align:center;line-height:1.2}
.hb svg{width:26px;height:26px;color:var(--primary)}
.hb[aria-current="true"]{border-color:var(--primary)}
.hb .badge{position:absolute;top:6px;right:8px}
.sec-t{font-size:26px;margin:2px 0 14px}
.modal-velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;width:min(92vw,520px);max-height:82vh;overflow:auto;background:var(--surface);border-radius:18px;padding:18px 18px 16px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.modal-h h2{font-size:21px}
.cerrar{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:20px;line-height:1;color:var(--muted)}
.mes-t{font-family:var(--head);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:18px 2px 8px}
button.cal-d{text-align:left;cursor:pointer;color:inherit;font:inherit}
button.cal-d:hover{border-color:var(--primary)}
.editado{font-size:12px;color:var(--accent);font-weight:700}
.cd-board{display:grid;gap:6px;justify-content:center;margin:8px 0 14px}
.cd-row{display:flex;gap:8px;align-items:center}
.cd-b{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cd-p{min-width:70px;font-size:18px;letter-spacing:2px;color:var(--ink);margin-left:6px}
.nm-vis{text-align:center;margin:6px 0 12px}.nm-num{font-family:var(--head);font-weight:800;font-size:64px;line-height:1.1}
.lt-word{display:flex;gap:5px;justify-content:center;margin:10px 0 12px}
.lt-c{width:34px;height:48px;border-bottom:4px solid var(--ink);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:28px;text-transform:uppercase}
.lt-vidas{display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:12px}
.lt-vidas i{width:14px;height:14px;border-radius:50%;background:var(--primary)}.lt-vidas i.fuera{background:var(--line)}
.lt-vidas span{margin-left:8px}
.pj-g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:8px auto 10px}
.pj-c{aspect-ratio:1;border-radius:14px;border:0;background:var(--primary);font-size:34px;display:grid;place-items:center;transition:transform .15s}
.pj-c.up{background:var(--surface);border:2px solid var(--line)}
.pj-c.ok{background:color-mix(in srgb, var(--primary) 18%, var(--surface));border-color:var(--primary)}
.pj-c.mal{border-color:var(--danger);background:var(--danger-soft)}
.pj-c:disabled{opacity:1;cursor:default}
.sd-g{display:grid;grid-template-columns:repeat(6,1fr);max-width:340px;margin:8px auto 12px;border:3px solid var(--ink);border-radius:8px;overflow:hidden}
.sd-c{aspect-ratio:1;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);font-family:var(--head);font-weight:700;font-size:24px;color:var(--ink)}
.sd-c.fija{color:var(--ink);background:color-mix(in srgb, var(--ink) 6%, var(--surface))}
.sd-c.puesta{color:var(--primary)}
.sd-c.sel{background:color-mix(in srgb, var(--accent) 28%, var(--surface))}
.sd-c.mal{background:var(--danger-soft)}
.sd-c.bd-r{border-right:3px solid var(--ink)}
.sd-c.bd-b{border-bottom:3px solid var(--ink)}
.sd-c:disabled{opacity:1;cursor:default}
/* Sudoku 9×9 */
.s9-g{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,396px);margin:8px auto 10px;border:3px solid var(--ink);border-radius:8px;overflow:hidden}
.s9-c{aspect-ratio:1;min-width:0;padding:0;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);font-family:var(--head);font-weight:700;font-size:clamp(17px,5vw,23px);color:var(--ink);position:relative}
.s9-c.fija{background:color-mix(in srgb, var(--ink) 7%, var(--surface))}
.s9-c.puesta{color:var(--primary)}
.s9-c.zona{background:color-mix(in srgb, var(--primary) 9%, var(--surface))}
.s9-c.fija.zona{background:color-mix(in srgb, var(--primary) 14%, var(--surface))}
.s9-c.igual{background:color-mix(in srgb, var(--accent) 22%, var(--surface))}
.s9-c.sel{background:color-mix(in srgb, var(--accent) 38%, var(--surface))}
.s9-c.mal{background:var(--danger-soft);color:var(--danger)}
.s9-c.br{border-right:3px solid var(--ink)}
.s9-c.bb{border-bottom:3px solid var(--ink)}
.s9-c:nth-child(9n){border-right:0}
.s9-c:disabled{opacity:1;cursor:default}
.s9-n{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);font-family:var(--body);font-weight:700;font-size:clamp(8px,2.2vw,10px);line-height:1;color:var(--muted)}
.s9-n span{display:grid;place-items:center}
.herr{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 10px}
.herr .opt{font-size:14px;padding:7px 14px}
/* Nonograma */
.nn-wrap{overflow-x:auto;margin:8px auto 10px;max-width:100%}
.nn-t{border-collapse:collapse;margin:0 auto;width:auto}
.nn-t td,.nn-t th{padding:0;border:0;white-space:nowrap;background:none}
.nn-t th{font-family:var(--body);font-weight:700;font-size:12px;color:var(--muted);text-align:center;vertical-align:bottom;line-height:1.15}
.nn-t th.fila{text-align:right;vertical-align:middle;padding-right:6px;letter-spacing:.05em}
.nn-t th.hecha{color:var(--primary);opacity:.55}
.nn-c{width:clamp(28px,8.4vw,36px);height:clamp(28px,8.4vw,36px);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;font-size:16px;color:var(--muted);border-radius:0}
.nn-c.on{background:var(--ink);border-color:var(--ink)}
.nn-c.x::after{content:"✕";font-weight:700}
.nn-c.mal{background:var(--danger-soft);color:var(--danger)}
.nn-c.br{border-right:2px solid var(--ink)}
.nn-c.bb{border-bottom:2px solid var(--ink)}
.nn-c:disabled{opacity:1;cursor:default}
/* Reinas */
.rn-g{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,384px);margin:8px auto 10px;border:3px solid var(--ink);border-radius:8px;overflow:hidden}
.rn-c{aspect-ratio:1;min-width:0;padding:0;border:0;font-size:clamp(20px,6vw,28px);color:#1C2621;display:grid;place-items:center;font-weight:700;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.rn-c.br{box-shadow:inset -3px 0 0 #1C2621, inset 0 0 0 .5px rgba(0,0,0,.18)}
.rn-c.bb{box-shadow:inset 0 -3px 0 #1C2621, inset 0 0 0 .5px rgba(0,0,0,.18)}
.rn-c.br.bb{box-shadow:inset -3px 0 0 #1C2621, inset 0 -3px 0 #1C2621, inset 0 0 0 .5px rgba(0,0,0,.18)}
.rn-c.x::after{content:"✕";font-size:.6em;opacity:.55}
.rn-c.mal{outline:3px solid #A23B2C;outline-offset:-3px}
.rn-c:disabled{opacity:1;cursor:default}
.guia-s{border-top:1px solid var(--line)}
.guia-h{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:14px 2px;font-family:var(--head);font-weight:600;font-size:18px;color:var(--ink);text-align:left}
.guia-h span:last-child{color:var(--primary);font-size:22px;margin-left:10px}
.guia-l{margin:0 0 14px;padding-left:22px;line-height:1.5}
.guia-l li{margin-bottom:8px}
tr.fila-ed{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
tr.fila-ed:hover td,tr.fila-ed:active td{background:var(--soft)}
.lapiz{color:var(--primary);font-weight:700}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
h1{font-size:30px;font-weight:750;letter-spacing:-.01em}
h2{font-size:22px;font-weight:750}
h3{font-size:17px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:23px;line-height:1.05}
.marca{display:block;font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-top:3px}
.who{font-size:15px;color:var(--muted)}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--primary);background:var(--primary);color:var(--primary-ink);font-family:var(--head);font-weight:700;font-size:16px;display:grid;place-items:center;padding:0}
.avatar[aria-expanded="true"]{background:var(--surface);color:var(--primary)}
.cuenta{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;margin:-4px 0 16px}
.cuenta .yo{font-weight:700;padding:2px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.cuenta .yo small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.cuenta button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:11px 10px;font-weight:700;color:var(--primary)}
.cuenta button:hover{background:var(--soft)}
.cuenta button.salir{color:var(--danger)}
.link{background:none;border:0;padding:6px 0;color:var(--primary);text-decoration:underline;text-underline-offset:3px}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.nav-chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-bottom:20px}
.chip{padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;text-align:center}
.chip[aria-current="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.menu-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 16px;border-radius:12px;border:2px solid var(--primary);background:var(--surface);font-family:var(--head);font-weight:600;font-size:19px;text-align:left}
.menu-panel{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.menu-g{font-size:13px;color:var(--muted);font-weight:700;margin:8px 2px 6px;text-transform:uppercase;letter-spacing:.04em}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
#print-area{display:none}
.tab{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--primary)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;line-height:20px;text-align:center;margin-left:6px}

/* Login */
.cover{min-height:100%;display:grid;place-items:center;padding:24px 0}
.cover-inner{width:100%;max-width:440px}
.cover h1{font-size:40px;margin-bottom:6px}
.cover .lead{color:var(--muted);margin:0 0 28px}
.roles{display:grid;gap:10px}
.role{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px 18px}
.role strong{display:block;font-family:var(--head);font-size:19px}
.role span{color:var(--muted);font-size:15px}
.role:hover{border-color:var(--primary)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0 20px}
.name{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.name[aria-pressed="true"]{border-color:var(--primary);background:var(--soft)}

/* Forms */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:15px}
.input{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.input::placeholder{color:var(--muted);opacity:.8}
select.input option{background:var(--surface);color:var(--ink)}
:root{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
.input:focus{border-color:var(--primary);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;border:2px solid var(--primary);background:var(--primary);color:var(--primary-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.danger{border-color:var(--danger);background:transparent;color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--danger);font-weight:700;margin:8px 0}

/* Week */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weeknav h2{font-size:19px;text-align:center}
.arrow{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.days{display:grid;gap:8px}
.day{background:var(--surface);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.day.today{border-color:var(--primary)}
.day-head{width:100%;display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:none;border:0;text-align:left}
.day-name{font-family:var(--head);font-weight:600;font-size:17px;line-height:1.1}
.day-name small{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted)}
.day-sum{font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.plantilla{background:var(--accent-soft);color:var(--accent)}
.tag.cerrado{background:var(--line);color:var(--muted)}
.tag.abierto{background:var(--soft);color:var(--primary)}
.day.locked .day-head{opacity:.75}
.editor{padding:4px 14px 16px;border-top:1px solid var(--line)}
.q{padding:12px 0 4px}
.q > h3{margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:9px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.opt[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.opt:disabled,.opt[aria-disabled="true"]{cursor:not-allowed;opacity:.45;background:var(--bg);border-style:dashed}
.opt[aria-pressed="true"][aria-disabled="true"]{opacity:.6;background:var(--muted);border-color:var(--muted);color:var(--surface);border-style:solid}
.q.bloq h3::after{content:" · cerrado";font-family:var(--body);font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input:disabled{opacity:.5}
.arrow:disabled{opacity:.35}
.hora{display:flex;align-items:center;gap:10px;margin-top:10px}
.hora input{max-width:140px}
.editor-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}

/* Parte */
.status{border-radius:12px;padding:12px 14px;margin:0 0 16px;font-weight:700}
.status.prov{background:var(--accent-soft);color:var(--accent)}
.status.def{background:var(--soft);color:var(--primary)}
.blocks{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:24px}
.block{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.block h3{font-size:18px;margin-bottom:8px}
.count{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.count:last-of-type{border-bottom:0}
.count b{font-family:var(--head);font-size:24px;font-weight:750;font-variant-numeric:tabular-nums}
.reg{font-size:14px;color:var(--danger);margin:-2px 0 6px}
.reg-label{font-weight:700}
.list{margin:6px 0 0;padding:0;list-style:none;font-size:15px}
.list li{padding:3px 0}
.tablewrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--head);font-weight:600;background:var(--soft)}
tr:last-child td{border-bottom:0}
.chips-f{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;-webkit-user-select:none;user-select:none}
.chipf{padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--ink)}
.chipf b{font-family:var(--head);margin-left:2px}
.chipf[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.th-btn{background:none;border:0;padding:0;font:inherit;font-family:var(--head);font-weight:600;color:inherit;cursor:pointer;white-space:nowrap}
.tabla-qc th,.tabla-qc td{white-space:normal;padding:9px 8px;font-size:15px;vertical-align:top}
.tabla-qc th:nth-child(2),.tabla-qc td:nth-child(2),.tabla-qc th:nth-child(4),.tabla-qc td:nth-child(4){text-align:center;width:15%}
@media (max-width:520px){.tabla-qc th,.tabla-qc td{font-size:14px;padding:8px 6px}}
.regcell{color:var(--danger);font-size:13px;display:block}

/* Notes */
.notes{display:grid;gap:10px;margin-top:18px}
.note{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;max-width:88%}
.note.mine{justify-self:end;background:var(--soft);border-color:transparent}
.note .meta{font-size:13px;color:var(--muted);margin-bottom:4px}
.note.unread{border-color:var(--accent)}
textarea.input{min-height:90px;resize:vertical}
.chat{display:grid;gap:8px;margin:6px 0 16px}
.chat .note{max-width:86%}
.chat .note.mine{justify-self:end}
.chat-dia{justify-self:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--bg);padding:2px 10px;border-radius:999px;margin-top:6px}
.chat-tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-top:6px}
.chat-acc{margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;font-size:14px}
.chat-acc .link{padding:0;font-size:14px}
.chat .note{cursor:pointer;-webkit-user-select:text;user-select:text;transition:box-shadow .2s}
.chat .note.elegida{box-shadow:0 0 0 3px var(--accent)}
.chat .note.destello{box-shadow:0 0 0 3px var(--primary)}
.chat-ap{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.chat .note.es-ap{border-color:var(--accent);border-style:dashed}
.msg-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px;margin:0 0 14px}
.msg-seg button{border:0;border-radius:10px;padding:10px 8px;background:none;font-weight:700;font-size:15px;color:var(--muted);line-height:1.2;position:relative}
.msg-seg button small{display:block;font-weight:400;font-size:12px}
.msg-seg button[aria-current="true"]{background:var(--primary);color:var(--primary-ink)}
.msg-seg .badge{margin-left:6px}
.cita{display:block;width:100%;text-align:left;background:color-mix(in srgb, var(--ink) 6%, transparent);border:0;border-left:4px solid var(--primary);border-radius:8px;padding:6px 10px;margin:0 0 6px;font-size:14px;color:var(--ink);line-height:1.35}
.cita b{display:block;font-size:12px;color:var(--primary)}
.note.mine .cita{border-left-color:var(--accent)}
.note.mine .cita b{color:var(--accent)}
.cbar{padding:2px 4px 8px;max-width:760px;margin:0 auto}
.cbar-resp{display:flex;align-items:center;gap:8px;background:var(--bg);border-left:4px solid var(--primary);border-radius:10px;padding:6px 6px 6px 10px;margin:0 0 6px;font-size:14px}
.cbar-resp div{flex:1;min-width:0}
.cbar-resp b{display:block;font-size:12px;color:var(--primary)}
.cbar-resp span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.cbar-resp button{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:var(--surface);font-size:20px;line-height:1}
.cbar-in{display:flex;gap:8px;align-items:flex-end}
.cbar-in textarea.input{flex:1;min-height:44px;max-height:132px;resize:none;border-radius:22px;padding:10px 16px;line-height:1.35;overflow-y:auto}
.cbar-send{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center}
.cbar-send svg{width:22px;height:22px}
.cbar-send:disabled{opacity:.4}
.av-parte{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:12px 14px;margin:0 0 16px}
.av-parte .res{margin:8px 0 0}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--primary)}
details.plegable{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:18px 0}
details.plegable summary{font-family:var(--head);font-weight:600;cursor:pointer}
details.plegable[open] summary{margin-bottom:10px}
.alert{background:var(--accent-soft);color:var(--ink);border-left:5px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:16px}

/* Residents admin */
.res{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.res.off{opacity:.55}
.panel{background:var(--surface);border:2px solid var(--primary);border-radius:14px;padding:16px;margin-bottom:16px}


/* Palabra del día */
.wl-board{display:grid;gap:6px;justify-content:center;margin:8px 0 16px}
.wl-row{display:grid;grid-template-columns:repeat(5,52px);gap:6px}
.wl-c{height:52px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-family:var(--head);font-weight:750;font-size:24px;text-transform:uppercase;background:var(--surface)}
.wl-c.c,.wl-k.c,.mini i.c{background:#3E8E5E;border-color:#3E8E5E;color:#fff}
.wl-c.p,.wl-k.p,.mini i.p{background:#C49A1E;border-color:#C49A1E;color:#fff}
.wl-c.a,.wl-k.a,.mini i.a{background:#7C8A83;border-color:#7C8A83;color:#fff}
.wl-kb{display:grid;gap:6px;max-width:520px;margin:0 auto 22px}
.wl-kr{display:flex;gap:4px;justify-content:center}
.wl-k{flex:1;min-width:0;height:50px;border:0;border-radius:6px;background:var(--line);color:var(--ink);font-weight:700;text-transform:uppercase;padding:0;font-size:16px}
.wl-k.wide{flex:1.7;font-size:12px}
.mini{display:inline-grid;grid-template-columns:repeat(5,10px);gap:2px;vertical-align:middle}
.mini i{width:10px;height:10px;border-radius:2px;display:block;background:var(--line)}
/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:18px}
.cal-h{font-size:12px;color:var(--muted);text-align:center;font-weight:700}
.cal-d{min-height:66px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;font-size:12px;overflow:hidden}
.cal-d.vacio{background:transparent;border-color:transparent}
.cal-d.hoy{border:2px solid var(--primary)}
.cal-n{font-weight:700}
.cal-i{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:0 3px;margin-top:2px;font-size:11px}
.cal-i.cumple{background:var(--accent-soft);color:var(--accent)}
.cal-i.evento{background:var(--soft);color:var(--primary)}
/* Efemérides */
.cal-d{position:relative}
.cal-ef{position:absolute;right:3px;bottom:3px;min-width:16px;height:16px;padding:0 3px;box-sizing:border-box;border-radius:8px;background:var(--cena);color:var(--surface);font-size:10px;font-weight:700;line-height:16px;text-align:center}
.tag.ef{background:color-mix(in srgb, var(--cena) 16%, transparent);color:var(--cena)}
.ef-card{background:var(--accent-soft);border:2px solid color-mix(in srgb, var(--accent) 35%, transparent);border-radius:14px;padding:14px 16px;margin:0 0 16px;color:var(--ink)}
.ef-card .ef-card-h,.ef-card .ef-card-f{display:flex}
.ef-car{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ef-car::-webkit-scrollbar{display:none}
.ef-sl{flex:0 0 100%;min-width:0;scroll-snap-align:start;display:block;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.ef-sl > span{display:block}
.ef-dots{display:flex;gap:2px;align-items:center}
.ef-dot{width:28px;height:28px;border:0;background:none;padding:0;position:relative;cursor:pointer}
.ef-dot::after{content:"";position:absolute;left:9px;top:9px;width:10px;height:10px;border-radius:50%;background:color-mix(in srgb, var(--accent) 35%, transparent)}
.ef-dot[aria-current="true"]::after{background:var(--accent)}
.ef-ver{text-decoration:none;font-weight:700;padding:6px 0}
.ef-hint{margin:2px 0 0}
.ef-x{width:32px;height:32px;margin:-6px -8px -6px 0;border:0;background:none;color:var(--accent);font-size:22px;line-height:1;cursor:pointer;border-radius:50%}
.ef-fecha{gap:10px;margin:-2px 0 14px;flex-wrap:wrap}
.ef-fecha label{font-weight:700;font-size:15px}
.ef-fecha .input{width:auto;padding:8px 10px}
.ef-card-h{justify-content:space-between;gap:8px;font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.ef-y{display:block;margin-top:6px}
.ef-y b{font-family:var(--head);font-weight:750;font-size:28px;line-height:1;color:var(--primary);margin-right:6px}
.ef-card .ef-y b{color:var(--ink)}
.ef-t{display:block;font-family:var(--head);font-weight:600;font-size:19px;line-height:1.2;margin:4px 0 0}
.ef-ex{font-size:15px;line-height:1.4;margin-top:6px}
.ef-card-f{justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:15px;font-weight:700}
.ef-ver{color:var(--primary);white-space:nowrap}
.ef-art{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.ef-art .ef-t{margin:4px 0 8px;font-size:20px}
.ef-p{margin:0 0 8px;font-size:16px;line-height:1.55}
.ef-mas{margin-top:4px;padding:8px 14px}
.ef-sub{display:block;font-family:var(--body);font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.ef-aviso{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 16px}
.ef-sw{flex:none;width:52px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0;cursor:pointer}
.ef-sw span{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.ef-sw[aria-checked="true"]{background:var(--primary)}
.ef-sw[aria-checked="true"] span{left:24px}
.ef-busca{flex-wrap:nowrap;margin-bottom:14px}
.ef-busca .input{flex:1;min-width:0}
.ef-hit{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;max-width:90vw;z-index:10}
/* Resumen del mes y panel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 18px}
.kpi{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .k-l{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .k-n{font-family:var(--head);font-weight:750;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;margin:2px 0}
.kpi .k-s{font-size:13px;color:var(--muted);line-height:1.35}
.kpi .k-d{font-weight:700;color:var(--ink)}
.kpi.des{border-top:5px solid var(--accent)} .kpi.com{border-top:5px solid var(--primary)} .kpi.cen{border-top:5px solid var(--cena)}
.tarjeta{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 16px;min-width:0}
.tarjeta h3{margin:0 0 4px}
.tarjeta .sub{font-size:13px;color:var(--muted);margin:0 0 10px}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 16px}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:700;margin:0 0 6px}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.graf{width:100%;height:auto;display:block;overflow:visible}
.graf text{font-family:var(--body);font-size:12px;fill:var(--muted)}
.graf .rej{stroke:var(--line);stroke-width:1}
.hb-l{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto;gap:6px 10px;align-items:center;font-size:15px}
.hb-b{height:14px;border-radius:999px;background:var(--bg);overflow:hidden}
.hb-b i{display:block;height:100%;border-radius:999px;background:var(--primary)}
.hb-l b{font-variant-numeric:tabular-nums}
.tabla-mes td,.tabla-mes th{text-align:right;padding:7px 10px;font-variant-numeric:tabular-nums}
.tabla-mes td:first-child,.tabla-mes th:first-child{text-align:left}
.tabla-mes tr.finde td{background:color-mix(in srgb, var(--soft) 55%, transparent)}
.tabla-mes tr.tot td{font-weight:700;border-top:2px solid var(--ink);background:var(--soft)}
.tabla-mes td.prov{color:var(--muted);font-style:italic}
.estado-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.estado-g button,.estado-g div{background:var(--bg);border:0;border-radius:12px;padding:10px 12px;text-align:left;font:inherit;color:inherit}
.estado-g b{display:block;font-family:var(--head);font-size:24px;font-variant-numeric:tabular-nums}
.estado-g span{font-size:13px;color:var(--muted);font-weight:700}
.estado-g .aviso b{color:var(--accent)}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}

@media (max-width:520px){
  h1{font-size:26px}
  .day-head{grid-template-columns:78px 1fr}
  .day-head .tagcol{grid-column:2}
  .blocks{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .bnav,.hoja,.velo,.sec-t{display:none!important}
  #app{display:none!important}
  #print-area{display:block!important}
  body{background:#fff;color:#000;font-size:12px}
  .top,.tabs,.no-print,.toast{display:none!important}
  .block,.tablewrap{border-color:#999}
  .blocks{grid-template-columns:1fr 1fr}
}

<script type="module">
/* ---------- Conexión con Firebase ---------- */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, initializeAuth, inMemoryPersistence, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getMessaging, getToken, deleteToken, isSupported as pushSoportado } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";
import { initializeFirestore, doc as fdoc, collection as fcol, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot as fsnap, query, where as fwhere, writeBatch, deleteField, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FB_CONFIG = {
  apiKey: "AIzaSyA5dr_N0Z8VqiRWTCDMHbrRsmK6gFsUDBM",
  authDomain: "libro-comidas-mizar.firebaseapp.com",
  projectId: "libro-comidas-mizar",
  storageBucket: "libro-comidas-mizar.firebasestorage.app",
  messagingSenderId: "574865497497",
  appId: "1:574865497497:web:ec6708809617672cd50708"
};
const DOMINIO = "libro-comidas-mizar.app";
const VERSION = "2026.11.09-5";

const fbApp = initializeApp(FB_CONFIG);
const auth = getAuth(fbApp);
const fs = initializeFirestore(fbApp, {ignoreUndefinedProperties:true});
let secAuth = null;
function authSecundaria(){ if (!secAuth) secAuth = initializeAuth(initializeApp(FB_CONFIG, "altas"), {persistence: inMemoryPersistence}); return secAuth; }
const emailNuevo = u => u + "." + Date.now().toString(36) + "@" + DOMINIO;

/* Capa fina sobre Firestore con la misma forma que usaba el prototipo */
const wrap = s => ({id:s.id, exists:s.exists(), data:()=>s.data()});
function mkDoc(path){ const r = fdoc(fs, path); return {id:r.id, path,
  get: async()=>wrap(await getDoc(r)), set:d=>setDoc(r,d), update:d=>updateDoc(r,d), delete:()=>deleteDoc(r),
  onSnapshot:(n,e)=>fsnap(r, s=>n(wrap(s)), e)}; }
function mkCol(path, cons=[]){ const base = fcol(fs, path), q = cons.length ? query(base, ...cons) : base; return {
  where:(f,op,v)=>mkCol(path,[...cons, fwhere(f,op,v)]), doc:id=>mkDoc(path+"/"+id),
  get: async()=>{ const s = await getDocs(q); return {docs:s.docs.map(wrap)}; },
  onSnapshot:(n,e)=>fsnap(q, s=>n({docs:s.docs.map(wrap)}), e)}; }

/* ---------- Utilidades ---------- */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const wd = s => (parse(s).getDay()+6)%7;
const today = () => iso(new Date());
const mondayOf = s => addDays(s,-wd(s));
const fmtDay = s => { const d = parse(s); return d.getDate()+" de "+MESES[d.getMonth()]; };
const fmtLong = s => DIAS[wd(s)]+" "+fmtDay(s);
const esFinde = f => wd(f)>=5;
/* Hora límite: 1) día especial (festivo…), 2) hora de ese día de la semana, 3) valores por defecto */
const horaSemana = i => { const c = S.config||{}, h = (c.horasDia||{})[i]; return h || (i>=5 ? (c.horaCierreFinde || "10:30") : (c.horaCierre || "09:30")); };
const horaCierre = (f) => { const d = f||today(), ex = (S.config||{}).excepciones||{}; return ex[d] || horaSemana(wd(d)); };
const esEspecial = f => !!(((S.config||{}).excepciones||{})[f]);
function cierre(s){ const [h,m] = horaCierre(s).split(":").map(Number); const d = parse(s); d.setHours(h,m,0,0); return d; }
const locked = s => new Date() >= cierre(s);

const VACIO = {comida:"no", horaBolsa:"", cena:false, desayuno:false, llevar:"nada"};
const COMIDA = [["no","No como"],["primer","1.er turno"],["normal","Normal"],["segundo","2.º turno"],["bolsa","En bolsa"]];
const LLEVAR = [["nada","Nada"],["tupper","Tupper"],["bolsa","Bolsa de comida"]];
const norm = o => ({...VACIO, ...(o||{})});
const comidaTxt = sel => { const c = COMIDA.find(x=>x[0]===sel.comida); return sel.comida==="bolsa" ? "En bolsa"+(sel.horaBolsa?" a las "+sel.horaBolsa:"") : c ? c[1] : "No come"; };

/* ---------- Estado ---------- */
const S = {
  db:null, noDb:false, cfgLoaded:false, resLoaded:false,

async function w(fn){

  if (rol!=="cocina"){
    const cq = rol==="admin" ? S.db.collection("consultas") : S.db.collection("consultas").where("autor","==",pid);

      const prev = S.cqTs || {}; S.consultas = q.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.ultimoTs||0)-(a.ultimoTs||0));
      const ahora = {}; S.consultas.forEach(c=>ahora[c.id]=c.ultimoTs||0);
      if (S.cqTs) S.consultas.forEach(c=>{ if ((c.ultimoTs||0) > (prev[c.id]||0)){ const ult = (c.mensajes||[]).slice(-1)[0]; if (ult && ult.quien!==pid) toast(rol==="admin" ? "Nuevo mensaje de un residente." : "Los administradores te han respondido."); } });

  add(S.db.collection("adscritos").where("fecha",">=",addDays(today(),-28)).onSnapshot(q => {

/* ---------- Historial: borrar datos antiguos ---------- */
async function borrarHistorial(limite){
  const limiteMs = parse(limite).getTime(); let total = 0;
  const grupos = [["pedidos", fwhere("fecha","<",limite)], ["extras", fwhere("fecha","<",limite)], ["adscritos", fwhere("fecha","<",limite)], ["wordle", fwhere("fecha","<",limite)], ["eventos", fwhere("fecha","<",limite)], ["mensajes", fwhere("ts","<",limiteMs)]];
  for (const [col, cond] of grupos){
    const snap = await getDocs(query(fcol(fs, col), cond));
    const docs = col!=="eventos" ? snap.docs : snap.docs.filter(d=>{ const e = d.data(); return (!e.repite || e.repite==="no") && (!e.fin || e.fin<limite); });
    for (let i=0; i<docs.length; i+=400){ const b = writeBatch(fs); docs.slice(i,i+400).forEach(d=>b.delete(d.ref)); await b.commit(); }
    total += docs.length;
  }
  await S.db.doc("config/general").update({ultimaLimpieza: today(), ultimaLimpiezaBorrados: total});
  return total;
}
/* Automático: si está activado, cada trimestre se borra lo que tenga más de 3 meses */
async function limpiarAntiguos(){
  const c = S.config || {};
  if (!c.limpiezaAuto) return;
  if (c.ultimaLimpieza && c.ultimaLimpieza > addDays(today(), -91)) return;
  try { await borrarHistorial(addDays(today(), -91)); } catch(e){ console.warn("Limpieza automática:", e); }
}

/* Paso de los nombres a su propia colección (solo una vez, lo hace el administrador principal) */
async function migrarNombres(manual){
  const me = resById(S.session && S.session.uid);
  if (!me || !puedeGestionarAdmins(me)){ if (manual) toast("Solo el administrador principal puede hacerlo."); return; }
  const viejos = Object.entries(S.pub).filter(([id,p])=>("nombre" in p) || ("usuario" in p) || !p.iniciales);
  const sinCumple = Object.keys(S.pub).filter(id=>(S.priv[id]||{}).cumple && (S.nom[id]||{}).cumple !== S.priv[id].cumple && !viejos.some(v=>v[0]===id));
  const evViejos = S.eventos.filter(e=>!e.estado);
  if (!viejos.length && !sinCumple.length && !evViejos.length) return;
  try {
    const b = writeBatch(fs);
    viejos.forEach(([id,p])=>{
      const nombre = p.nombre || (S.nom[id]||{}).nombre || "", usuario = p.usuario || (S.nom[id]||{}).usuario || "";
      if (nombre || usuario) b.set(fdoc(fs,"nombres/"+id), {nombre, usuario}, {merge:true});
      const upd = {iniciales: p.iniciales || inicialesDe(nombre)};
      if ("nombre" in p) upd.nombre = deleteField();
      if ("usuario" in p) upd.usuario = deleteField();
      b.update(fdoc(fs,"usuarios/"+id), upd);
      if ((S.priv[id]||{}).cumple) b.set(fdoc(fs,"nombres/"+id), {cumple:S.priv[id].cumple}, {merge:true});
    });
    sinCumple.forEach(id=>b.set(fdoc(fs,"nombres/"+id), {cumple:S.priv[id].cumple}, {merge:true}));
    evViejos.forEach(e=>b.update(fdoc(fs,"eventos/"+e.id), {estado:"aprobado"}));
    await b.commit();
    if (manual) toast("Nombres protegidos correctamente.");
  } catch(e){ console.warn("Migración de nombres:", e); if (manual) toast("No se ha podido completar ("+(e.code||e.message)+"). Envía una captura al responsable."); }
}

async function entrarCon(user){
  limpiar();
  if (!user){ S.authListo = true; render(); return; }
  try {
    const c = await S.db.doc("cuentas/"+user.uid).get();
    if (!c.exists){ S.loginErr = "Este acceso ya no es válido. Pide al administrador una contraseña nueva."; await signOut(auth); return; }
    const pid = c.data().perfil, p = await S.db.doc("usuarios/"+pid).get();
    if (!p.exists || p.data().activo===false){ S.loginErr = "Tu usuario está dado de baja."; await signOut(auth); return; }
    S.session = {uid:pid}; S.authListo = true; S.loginErr = "";
    suscribir(pid, p.data().rol || "residente");
    if (PUSH_ROLES.includes(p.data().rol || "residente")) setTimeout(refrescarPush, 4000);
  } catch(e){ console.error(e); S.loginErr = e.code==="permission-denied" ? "Tu usuario está dado de baja o no tiene acceso. Habla con el administrador." : "No se ha podido entrar ("+(e.code||e.message)+")."; S.authListo = true; try { await signOut(auth); } catch(e2){} }
  render();
}

/* ---------- Avisos al móvil (notificaciones push, las envía el robot de GitHub) ---------- */
const PUSH_ROLES = ["residente","cocina","admin"];
const esIOS = () => /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints>1 && /Macintosh/.test(navigator.userAgent));
const instalada = () => !!((window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true);
const dispositivo = () => esIOS() ? "iPhone" : /Android/i.test(navigator.userAgent) ? "Android" : "Ordenador";
let swReg = null, msgApi = null;
async function pushListo(){
  if (msgApi) return msgApi;
  if (!("serviceWorker" in navigator) || !("Notification" in window)) return null;
  try { if (!(await pushSoportado())) return null; } catch(e){ return null; }
  swReg = await navigator.serviceWorker.register("firebase-messaging-sw.js");
  await navigator.serviceWorker.ready;
  msgApi = getMessaging(fbApp); return msgApi;
}
const tokenGuardado = () => { try { return localStorage.getItem("mizar.push") || ""; } catch(e){ return ""; } };
function estadoPush(){
  if (esIOS() && !instalada()) return "ios";
  if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) return "no";
  if (Notification.permission==="denied") return "bloqueado";
  if (Notification.permission==="granted" && tokenGuardado()) return "on";
  return "off";
}
async function guardarToken(tk){
  const viejo = tokenGuardado();
  if (viejo && viejo!==tk){ try { await S.db.doc("tokens/"+viejo).delete(); } catch(e){} }
  await S.db.doc("tokens/"+tk).set({perfil:S.session.uid, ts:Date.now(), disp:dispositivo(), efem:efemOn()});
  try { localStorage.setItem("mizar.push", tk); } catch(e){}
}
async function activarPush(){
  const vapid = (S.config||{}).vapid;
  if (!vapid){ toast("Los avisos todavía no están configurados. Avisa al administrador principal."); return; }
  let perm = "default"; try { perm = await Notification.requestPermission(); } catch(e){}
  if (perm!=="granted"){ toast(perm==="denied" ? "Has bloqueado los avisos: actívalos en los ajustes del móvil." : "No se han activado."); render(); return; }
  try {
    const m = await pushListo(); if (!m){ toast("Este dispositivo no admite avisos."); return; }
    await guardarToken(await getToken(m, {vapidKey:vapid, serviceWorkerRegistration:swReg}));
    toast("Avisos activados en este dispositivo.");
  } catch(e){ console.error(e); toast("No se han podido activar ("+(e.code||e.message)+")."); }
  render();
}
async function desactivarPush(){
  const tk = tokenGuardado();
  try { const m = await pushListo(); if (m) await deleteToken(m); } catch(e){}
  if (tk){ try { await S.db.doc("tokens/"+tk).delete(); } catch(e){} }
  try { localStorage.removeItem("mizar.push"); } catch(e){}
  toast("Avisos desactivados en este dispositivo."); render();
}
/* Al entrar: si los avisos estaban activados, renueva el registro y lo asocia a quien ha entrado */
async function refrescarPush(){
  try {
    if (!S.session || estadoPush()!=="on" || !(S.config||{}).vapid) return;
    const m = await pushListo(); if (!m) return;
    await guardarToken(await getToken(m, {vapidKey:S.config.vapid, serviceWorkerRegistration:swReg}));
  } catch(e){ console.warn("Avisos:", e); }
}
function queAvisa(rol){
  if (rol==="admin") return ["mensajes de la administración (y sus avisos)", "mensajes de residentes", "propuestas de eventos y de adscritos", "la efeméride del día, si lo activas en Efemérides"];
  if (rol==="cocina") return ["mensajes de los administradores", "avisos para el parte (📌)"];
  return ["respuestas de los administradores a tus mensajes", "avisos de los administradores para todos", "la efeméride del día, si lo activas en Efemérides"];
}
function pushModalHTML(rol){
  const e = estadoPush(), lista = `<ul class="guia-l">${queAvisa(rol).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  const pie = `<p class="muted small" style="margin:12px 0 0">Los avisos pueden tardar unos minutos en llegar. Se activan en cada dispositivo por separado.</p>`;
  if (e==="ios") return `<p style="margin-top:0">En iPhone los avisos solo funcionan con la aplicación <b>instalada en la pantalla de inicio</b> (iOS 16.4 o posterior):</p><ol class="guia-l"><li>Abre la aplicación en <b>Safari</b>.</li><li>Pulsa el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba).</li><li>Elige <b>«Añadir a pantalla de inicio»</b>.</li><li>Abre la aplicación desde ese icono y vuelve aquí: círculo de tus iniciales → «Avisos en el móvil».</li></ol>` + pie;
  if (e==="no") return `<p style="margin-top:0">Este navegador no admite avisos. En Android usa <b>Chrome</b>; en iPhone, la aplicación instalada en la pantalla de inicio.</p>`;
  if (e==="bloqueado") return `<p style="margin-top:0">Los avisos están <b>bloqueados</b> para esta aplicación. Para permitirlos:</p><ul class="guia-l"><li><b>Android (Chrome):</b> toca el candado o los tres puntos → Información del sitio → Notificaciones → Permitir.</li><li><b>iPhone:</b> Ajustes → Notificaciones → Mizar → Permitir notificaciones.</li></ul><p>Después vuelve aquí y pulsa «Activar avisos».</p><button class="btn" data-a="push-on">Activar avisos</button>` + pie;
  if (e==="on") return `<div class="status def">Avisos activados en este dispositivo.</div><p>Te avisaremos de:</p>${lista}<button class="btn danger" data-a="push-off">Desactivar en este dispositivo</button>` + pie;
  return `<p style="margin-top:0">Recibe un aviso en el móvil aunque tengas la aplicación cerrada. Te avisaremos de:</p>${lista}<button class="btn" data-a="push-on">Activar avisos</button><p class="muted small">El móvil te preguntará si permites las notificaciones: pulsa «Permitir».</p>` + pie;
}

/* ---------- ¿Hay una versión nueva publicada? ---------- */
let ultimaComprobacion = 0;
async function comprobarVersion(){
  if (Date.now() - ultimaComprobacion < 60000) return;
  ultimaComprobacion = Date.now();
  try {
    const r = await fetch(location.pathname + "?comprobar=" + Date.now(), {cache:"no-store"});
    if (!r.ok) return;
    const m = (await r.text()).match(/const VERSION = "([^"]+)"/);
    if (m && m[1] !== VERSION && !S.hayNueva){ S.hayNueva = m[1]; refrescarCache(); render(); }
  } catch(e){}
}
/* Renueva la copia guardada de la página de inicio, para que al volver a abrir la app no salga una versión antigua */
function refrescarCache(){
  const urls = [location.pathname, "./", "index.html"];
  return Promise.all(urls.map(u => fetch(u, {cache:"reload"}).catch(()=>{})));
}
/* Si venimos del botón «Actualizar ahora» (?v=...), dejamos guardada la versión nueva y limpiamos la dirección */
if (/[?&]v=\d/.test(location.search)){
  refrescarCache();
  try { history.replaceState(null, "", location.pathname); } catch(e){}
}
/* Trabajador de fondo: hace que la app pida siempre la página al servidor al abrirse */
if ("serviceWorker" in navigator){
  const regSW = () => navigator.serviceWorker.register("firebase-messaging-sw.js").catch(()=>{});
  if (document.readyState==="complete") regSW(); else window.addEventListener("load", regSW);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState==="visible") comprobarVersion(); });
window.addEventListener("focus", comprobarVersion);
setTimeout(comprobarVersion, 3000);
setInterval(comprobarVersion, 15*60000);
function franjaVersion(){
  return S.hayNueva ? `<div class="status def no-print" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span>Hay una versión nueva de la aplicación.</span><button class="btn" data-a="actualizar">Actualizar ahora</button></div>` : "";
}

  const a = document.activeElement, fid = a && a.id, sel = a && a.selectionStart;
  $app.innerHTML = view();

const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k]||ICO.mas}</svg>`;

function navegacion(list, rol, comensal){
  if (rol==="admin"){ // Mensajes con la administración y de residentes, juntos en un botón
    const n = list.find(x=>x[0]==="notas"), c = list.find(x=>x[0]==="consultas");
    if (n && c){ const i = list.indexOf(n); list = list.filter(x=>x!==n && x!==c); list.splice(i, 0, ["mensajes","Mensajes",(Number(n[2])||0)+(Number(c[2])||0)||"",n[3]]); }
  }
  const pref = rol==="adscritos" ? ["adscritos"]
    : rol==="cocina" ? ["parte","resumen","notas","calendario","cumples"]
    : rol==="admin" ? (comensal ? ["semana","parte","mensajes","panel"] : ["parte","panel","extras","mensajes"])
    : ["semana","quien","calendario","consultas"];
  const visibles = pref.map(k=>list.find(x=>x[0]===k)).filter(Boolean);
  const resto = list.filter(x=>!visibles.includes(x));
  const enResto = resto.some(x=>x[0]===S.tab || (x[0]==="mensajes" && (S.tab==="notas" || S.tab==="consultas"))), pendResto = resto.reduce((n,x)=>n+(Number(x[2])||0),0);
  const esMsg = S.tab==="notas" || S.tab==="consultas", dest = k => k==="mensajes" ? (S.msgUlt || "notas") : k, cur = k => k==="mensajes" ? esMsg : S.tab===k;

  const chat = S.tab==="notas" && !S.vista && !S.menu && (rol==="admin" || rol==="cocina") ? barraChat(rol) : "";
  return `${S.menu && resto.length ? `<div class="velo" data-a="menu"></div><div class="hoja" role="dialog" aria-label="Más secciones"><div class="hoja-in"><p class="hoja-t">Más secciones</p><div class="hoja-g">${resto.map(([k,l,b])=>`<button class="hb" data-a="tab" data-v="${dest(k)}" aria-current="${cur(k)}">${svg(k)}${l}${b?`<span class="badge">${b}</span>`:""}</button>`).join("")}</div></div></div>` : ""}

function tabs(list){

  if (list.length<=7) return `<nav class="nav-chips" aria-label="Secciones">${list.map(([k,l,b])=>`<button class="chip" data-a="tab" data-v="${k}" aria-current="${S.tab===k}">${l}${b?`<span class="badge">${b}</span>`:""}</button>`).join("")}</nav>`;
  const act = list.find(x=>x[0]===S.tab) || list[0], pend = list.reduce((n,x)=>n+(Number(x[2])||0),0);

/* --- Editor de un día (para día concreto o plantilla) --- */
/* Cada ficha muestra lo que la persona hace ESE día. Por dentro, el desayuno y lo que se lleva
   se guardan en el registro del día anterior, que es el parte en el que la administración lo necesita. */
const prevCtx = ctx => ctx.startsWith("d:") ? "d:"+addDays(ctx.slice(2),-1) : "t:"+((Number(ctx.slice(2))+6)%7);
function vistaDia(ctx){ const a = selDe(ctx), b = selDe(prevCtx(ctx)); return {comida:a.comida, horaBolsa:a.horaBolsa, cena:a.cena, desayuno:b.desayuno, llevar:b.llevar}; }
function resumenDia(v){
  const p = [];
  if (v.desayuno) p.push("desayuno");
  if (v.llevar!=="nada") p.push(v.llevar==="tupper" ? "se lleva tupper" : "se lleva bolsa de comida");
  if (v.comida!=="no") p.push("comida "+comidaTxt(v).toLowerCase());
  if (v.cena) p.push("cena");
  if (!p.length) return "Sin servicios";
  const t = p.join(", ").replace("se lleva","te llevas"); return t.charAt(0).toUpperCase()+t.slice(1);
}
function editor(v, ctx, f, lockA, lockB){
  const seg = (k, opts, dis) => `<div class="seg" role="group">${opts.map(([val,l])=>`<button class="opt" ${dis?'aria-disabled="true"':""} data-a="set" data-ctx="${ctx}" data-k="${k}" data-v="${val}" aria-pressed="${String(v[k])===val}">${l}</button>`).join("")}</div>`;
  const yn = (k, dis) => seg(k, [["false","No"],["true","Sí"]], dis);
  const ant = f ? addDays(f,-1) : null;
  const notaB = f
    ? (lockB ? `<p class="small muted" style="margin:10px 0 0">Ya no se puede cambiar: se decidía hasta el ${esc(fmtLong(ant).toLowerCase())} a las ${esc(horaCierre(ant))}.</p>`
             : `<p class="small muted" style="margin:10px 0 0">Se cierra antes que el resto del día: puedes cambiarlo hasta el <b>${esc(fmtLong(ant).toLowerCase())} a las ${esc(horaCierre(ant))}</b>, porque se prepara la noche anterior.</p>`)
    : `<p class="small muted" style="margin:10px 0 0">El desayuno y lo que te llevas se avisan la víspera, porque se preparan la noche anterior.</p>`;
  return `
    <div class="q ${lockB?"bloq":""}"><h3>Desayuno</h3>${yn("desayuno", lockB)}
      <p class="small" style="margin:14px 0 6px;font-weight:700">¿Te llevas tupper o bolsa de comida ese día?</p>${seg("llevar", LLEVAR, lockB)}${notaB}</div>
    <div class="q ${lockA?"bloq":""}"><h3>Comida</h3>${v.llevar!=="nada" && v.comida==="no" ? `<p class="small muted" style="margin:-4px 0 8px">Te llevas ${v.llevar==="tupper"?"tupper":"bolsa de comida"}, así que ese día no comes aquí.</p>` : ""}${seg("comida", COMIDA, lockA)}
      ${v.comida==="bolsa" ? `<div class="hora"><label for="h_${ctx}">Hora a la que quieres la bolsa</label><input class="input" type="time" id="h_${ctx}" data-hora="${ctx}" value="${esc(v.horaBolsa)}" ${lockA?"disabled":""}></div>` : ""}
    </div>
    <div class="q ${lockA?"bloq":""}"><h3>Cena</h3>${yn("cena", lockA)}</div>`;
}

/* --- Parte del día --- */
function datosParte(f){
  const filas = activos().map(r=>({r, ...efectiva(r.id,f), editadoPor:(S.pedidos[f+"_"+r.id]||{}).editadoPor}));
  const g = fn => filas.filter(fn);
  const ex = extrasDe(f), exM = extrasDe(addDays(f,1)), ads = S.adscritos[f] || {};
  const avisos = S.mensajes.filter(m=>m.de==="admin" && m.fecha===f).map(m=>m.texto);
  if (ex.nota && notaParaDe(ex)!=="residentes") avisos.push(ex.nota);
  return {
    filas, avisos,
    turnos: [["1.er turno", g(o=>o.sel.comida==="primer"), (ex.primer||0)+(ads.primer||0), ads.primer||0], ["Turno normal", g(o=>o.sel.comida==="normal"), (ex.normal||0)+(ads.normal||0), ads.normal||0], ["2.º turno", g(o=>o.sel.comida==="segundo"), (ex.segundo||0)+(ads.segundo||0), ads.segundo||0]],
    bolsasExtra: Object.fromEntries(Object.entries(ex.bolsas||{}).filter(([h,n])=>n>0)),
    bolsas: g(o=>o.sel.comida==="bolsa").sort((a,b)=>String(a.sel.horaBolsa).localeCompare(String(b.sel.horaBolsa))),
    cena: [g(o=>o.sel.cena), ex.cena||0],
    desayuno: [g(o=>o.sel.desayuno), exM.desayuno||0],
    tupper: g(o=>o.sel.llevar==="tupper"), bolsaM: g(o=>o.sel.llevar==="bolsa")
  };
}
const proxParte = () => locked(today()) ? addDays(today(),1) : today();
function incluyeTxt(extra, ads){
  const e = (extra||0) - (ads||0), p = [];
  if (e>0) p.push(e+" comensal"+(e>1?"es":"")+" extra");
  if (ads>0) p.push(ads+" adscrito"+(ads>1?"s":""));
  return p.length ? "Incluye "+p.join(" y ") : "";
}
/* Textos de régimen: con nombres para administradores, con iniciales para la administración */
const SERV_REG = [["comida","Comida"],["cena","Cena"],["desayuno","Desayuno"],["llevar","Para llevar"]];
const regAplica = (r, srv) => !!r.regimen && (!r.regimenEn || r.regimenEn[srv] !== false);
function regAmbito(r){
  if (!r.regimen || !r.regimenEn) return "";
  const si = SERV_REG.filter(([k])=>r.regimenEn[k]!==false).map(([k,l])=>l.toLowerCase());
  return si.length===SERV_REG.length ? "" : si.length ? " (solo "+si.join(" y ")+")" : " (no se aplica)";
}
function regTxt(list, anon, srv){
  const x = list.filter(o=>regAplica(o.r, srv||"comida"));
  if (!x.length) return "";
  return anon ? "Con régimen: "+x.map(o=>iniciales(o.r)).join(", ") : "Régimen: "+x.map(o=>o.r.nombre+" ("+o.r.regimen+")").join(", ");
}
function bolsasPorHora(bolsas, extraB, anon){
  const by = {};
  bolsas.forEach(o=>{ const h=o.sel.horaBolsa||"Sin hora"; (by[h]=by[h]||{l:[],e:0}).l.push(o); });
  Object.entries(extraB||{}).forEach(([h,n])=>{ if (n>0) (by[h]=by[h]||{l:[],e:0}).e += n; });
  return Object.keys(by).sort().map(h=>{
    const {l,e} = by[h], n = l.length+e, parts = [];
    if (anon){ if (e) parts.push(e+" extra"); const r=l.filter(o=>regAplica(o.r,"comida")); if (r.length) parts.push("con régimen: "+r.map(o=>iniciales(o.r)).join(", ")); }
    else { l.forEach(o=>parts.push(o.r.nombre+(regAplica(o.r,"comida")?" ("+o.r.regimen+")":""))); if (e) parts.push(e+" extra"); }
    return {h, n, det: parts.join(anon?"; ":", ")};
  });
}
const sumaBolsas = b => Object.values(b||{}).reduce((a,n)=>a+(n>0?n:0),0);

}

/* ---------- Resumen mensual: cada parte cerrado se guarda como recuento ---------- */
/* Un registro por parte (día f): comida y cena de ese día; desayuno y para llevar del día siguiente. */
function resumenDeParte(f){
  const d = datosParte(f), ads = S.adscritos[f] || {}, n = (l, e) => l.length + (e||0), exB = sumaBolsas(d.bolsasExtra);
  return {fecha:f, c1:n(d.turnos[0][1], d.turnos[0][2]), cn:n(d.turnos[1][1], d.turnos[1][2]), c2:n(d.turnos[2][1], d.turnos[2][2]),
    cb:d.bolsas.length + exB, ce:n(d.cena[0], d.cena[1]), dm:n(d.desayuno[0], d.desayuno[1]), tm:d.tupper.length, bm:d.bolsaM.length,
    ex:d.turnos.reduce((a,t)=>a+t[2]-t[3],0) + exB + (d.cena[1]||0), exd:d.desayuno[1]||0, ad:(ads.primer||0)+(ads.normal||0)+(ads.segundo||0)};
}
function detalleDeParte(f){
  const p = {};
  activos().forEach(r=>{ const x = efectiva(r.id,f).sel, o = {}; if (x.comida!=="no") o.c = x.comida; if (x.cena) o.ce = 1; if (x.desayuno) o.d = 1; if (x.llevar!=="nada") o.l = x.llevar; if (Object.keys(o).length) p[r.id] = o; });
  return {fecha:f, p};
}
const CAMPOS_RES = ["c1","cn","c2","cb","ce","dm","tm","bm","ex","exd","ad"];
const igualRes = (a, b) => CAMPOS_RES.every(k=>(a[k]||0)===(b[k]||0));
const igualDet = (a, b) => JSON.stringify(Object.entries(a.p||{}).sort()) === JSON.stringify(Object.entries(b.p||{}).sort());
const inicioDatos = () => Object.values(S.pedidos).map(p=>p.fecha).filter(Boolean).sort()[0] || null;
const datosListos = () => S.resLoaded && S.listo.pedidos && S.listo.plantillas && S.listo.extras && S.listo.adscritos;
let syncT = null, syncando = false;
function programarSync(){ clearTimeout(syncT); syncT = setTimeout(sincronizarPartes, 3500); }
async function sincronizarPartes(){
  const rol = S.miRol; if ((rol!=="admin" && rol!=="cocina") || S.partesErr || syncando) return;
  if (!datosListos() || !S.listo.partes || (rol==="admin" && !S.listo.det)) return;
  const ini = inicioDatos(); if (!ini) return;
  syncando = true;
  try {
    let desde = ini; const lim = addDays(today(), -27); if (desde < lim) desde = lim;
    const bt = writeBatch(fs), hechos = []; let n = 0;
    for (let f = desde; f <= today(); f = addDays(f,1)){
      if (!locked(f)) continue;
      const forz = S.forzar.has(f), viejo = S.partes[f];
      if (!viejo || forz){ const nuevo = resumenDeParte(f); if (!viejo || !igualRes(viejo, nuevo)){ nuevo.ts = Date.now(); nuevo.rec = viejo ? !!viejo.rec : f < addDays(today(),-1); bt.set(fdoc(fs,"partes/"+f), nuevo); n++; } }

/* Cada fila es el día en que se sirve: el desayuno y lo que se lleva salen del parte de la víspera */

    const a = parteDe(f), b = parteDe(addDays(f,-1));

      comT: a ? a.c1+a.cn+a.c2+a.cb : null, prov: !!((a && a.prov) || (b && b.prov)), rec: !!((a && a.rec) || (b && b.rec))});
  }
  const sum = k => dias.reduce((t,d)=>t+(d[k]||0),0), sumA = k => dias.reduce((t,d)=>t+(d.a ? (d.a[k]||0) : 0),0);

/* --- Gráficos sencillos en SVG (siguen el modo claro u oscuro) --- */
const SERIES = [{k:"des", n:"Desayunos", c:"var(--accent)"}, {k:"comT", n:"Comidas", c:"var(--primary)"}, {k:"ce", n:"Cenas", c:"var(--cena)"}];

function techo(max){ const p = [5,10,15,20,25,30,40,50,60,80,100,150,200,300,400,500,800,1000,1500,2000,3000,5000]; return p.find(x=>x>=max) || Math.ceil(max/1000)*1000; }
function graficoLineas(puntos, series, etiqueta, titulo){
  const W = 700, H = 230, L = 34, R = 10, T = 10, B = 26, n = puntos.length;
  const tope = techo(Math.max(4, ...series.flatMap(x=>puntos.map(p=>p[x.k]||0))));

  for (let g=0; g<=4; g++){ const v = tope*g/4, y = Y(v); o += `<line class="rej" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmtN(v,0)}</text>`; }
  puntos.forEach((p,i)=>{ const e = etiqueta(p,i); if (e) o += `<text x="${X(i)}" y="${H-6}" text-anchor="middle">${esc(e)}</text>`; });
  series.forEach(x=>{ let d = "", pen = false; puntos.forEach((p,i)=>{ const v = p[x.k]; if (v==null){ pen = false; return; } d += (pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)+" "; pen = true; });
    o += `<path d="${d}" fill="none" stroke="${x.c}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (n<=40) puntos.forEach((p,i)=>{ const v = p[x.k]; if (v!=null) o += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.4" fill="${x.c}"/>`; }); });
  const banda = n<=1 ? (W-L-R) : (W-L-R)/(n-1);
  puntos.forEach((p,i)=>{ const t = (titulo ? titulo(p) : "")+": "+series.map(x=>x.n.toLowerCase()+" "+(p[x.k]==null?"—":fmtN(p[x.k]))).join(", "); o += `<rect x="${(X(i)-banda/2).toFixed(1)}" y="${T}" width="${banda.toFixed(1)}" height="${H-T-B+18}" fill="transparent" style="cursor:pointer" data-a="g-val" data-v="${esc(t)}"><title>${esc(t)}</title></rect>`; });
  return o + `</svg>`;
}
function graficoBarras(cats, series){

  const tope = techo(Math.max(4, ...cats.flatMap(c=>series.map(x=>c[x.k]||0))));
  const ancho = (W-L-R)/n, bw = Math.min(26, (ancho-10)/m), Y = v => T + (H-T-B)*(1 - v/tope);
  let o = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras">`;
  for (let g=0; g<=4; g++){ const v = tope*g/4, y = Y(v); o += `<line class="rej" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmtN(v,0)}</text>`; }
  cats.forEach((c,i)=>{ const x0 = L + i*ancho + (ancho - bw*m)/2;
    series.forEach((x,j)=>{ const v = c[x.k]||0, y = Y(v); o += `<rect x="${(x0+j*bw).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.max(0, H-B-y).toFixed(1)}" rx="3" fill="${x.c}"/>`; });

async function entregarArchivo(blob, filename, titulo){
  const movil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints>1 && /Macintosh/.test(navigator.userAgent));
  try { const file = new File([blob], filename, {type: blob.type}); if (movil && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:titulo}); return; } }
  catch(e){ if (e && e.name==="AbortError") return; }
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(e){}
  if (dl){ try { await dl.save({filename, data: blob}); } catch(e){ if (!e || e.code!=="declined") toast("No se ha podido descargar."); } return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

function juegoAuto(lunes){ const n = Math.floor(diasEntre("2026-11-02", lunes)/7), L = ORDEN_J.length; return ORDEN_J[(((n + 2) % L) + L) % L]; }

function semilla(f, k){ let h = 2166136261; for (const c of f+"|"+k) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function palabraDe(f){ const d = Math.round((parse(f) - new Date(2026,0,1))/86400000), n = WL_SOL.length; return WL_SOL[((d*7919) % n + n) % n]; }
const codigoDe = f => { let h = semilla(f,"codigo"), c = ""; for (let i=0;i<4;i++){ h = Math.imul(h ^ (h>>>15), 2246822507) >>> 0; c += String(1 + h % 6); } return c; };
function rng(seed){ let h = seed>>>0; return () => { h = Math.imul(h ^ (h>>>15), 2246822507)>>>0; h = Math.imul(h ^ (h>>>13), 3266489909)>>>0; h ^= h>>>16; return (h>>>0)/4294967296; }; }
function barajar(a, r){ for (let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
/* Parejas: 16 cartas (8 parejas), mismo orden para todos ese día */
const SIMBOLOS = ["🍎","🍐","🍋","🍇","🍓","🥕","🧀","🍪","🥐","🍅","🫒","🍒"];
const PJ_CACHE = {};
function parejasDe(f){ if (PJ_CACHE[f]) return PJ_CACHE[f]; const r = rng(semilla(f,"parejas")); const sim = barajar(SIMBOLOS.slice(), r).slice(0,8); return PJ_CACHE[f] = barajar([...sim, ...sim], r); }

const finEv = e => (e.fin && e.fin>e.fecha) ? e.fin : e.fecha;

const REPITE = {no:"No se repite", anual:"Cada año", mensual:"Cada mes", semanal:"Cada semana"};

  if (rep==="anual"){ for (let y=Number(desde.slice(0,4))-1; y<=Number(hasta.slice(0,4)); y++){ const s = y+e.fecha.slice(4); if (vale(s)) out.push(s); } }

function eventosEntre(desde, hasta){
  const out = [];

    if ((e.estado||"aprobado")!=="aprobado") return;
    const dur = diasEntre(e.fecha, finEv(e));

    });

function adscritosView(){

    tit = "Partidas de " + ((r||{}).nombre||"");
    cuerpo = `<p class="muted small" style="margin-top:0">Puedes borrar una partida, por ejemplo una de prueba. Sus puntos dejan de contar en el ranking. No se puede deshacer.</p>` +
      (partidas.length ? partidas.map(([id,x])=>`<div class="res"><div><strong>${esc(fmtLong(x.fecha))}</strong><div class="small muted">${esc((JUEGOS[tipoDe(x)]||{nombre:"Juego"}).nombre)}: ${x.estado==="ganado" ? "lo consiguió" : x.estado==="perdido" ? "no lo consiguió" : "sin terminar"}. ${x.puntos||0} punto${(x.puntos||0)===1?"":"s"}.</div></div>
        ${S.drafts.wlDel===id ? `<div class="row"><button class="btn danger" data-a="wl-del" data-id="${id}">Sí, borrar</button><button class="btn ghost" data-a="wl-del-no">No</button></div>` : `<button class="link" style="color:var(--danger)" data-a="wl-del-ask" data-id="${id}">Borrar</button>`}</div>`).join("") : `<p class="muted">No tiene partidas esta semana.</p>`);

      + `<div class="row" style="margin-top:6px">${PUSH_ROLES.includes(m.rol) && estadoPush()!=="on" ? `<button class="btn" data-a="push-abrir">Activar avisos en el móvil</button><button class="btn ghost" data-a="modal-cerrar">Entendido</button>` : `<button class="btn" data-a="modal-cerrar">Entendido</button>`}</div><p class="muted small" style="margin:12px 0 0">Puedes volver a verlo en el círculo de tus iniciales → «Novedades».</p>`;
  }
  if (m.tipo==="guia"){
    const g = guiaDe(m.rol), ab = S.guiaAb;
    tit = "Cómo se usa";
    cuerpo = `<p class="muted" style="margin-top:0">${esc(g.intro)} Toca un apartado para abrirlo.</p>` +
      g.secciones.map(([h, pasos], i)=>`<div class="guia-s"><button class="guia-h" data-a="guia-ab" data-v="${i}" aria-expanded="${ab===i}"><span>${esc(h)}</span><span aria-hidden="true">${ab===i?"−":"+"}</span></button>${ab===i ? `<ul class="guia-l">${pasos.map(x=>`<li>${x}</li>`).join("")}</ul>` : ""}</div>`).join("") +
      `<p class="muted small" style="margin:14px 0 0">Si algo no te sale o ves un error, escribe a los administradores.</p>`;
  }
  if (m.tipo==="evento"){
    tit = "Editar evento";
    cuerpo = `${camposFecha()}
      <div class="field"><label for="ev_tit">Qué se celebra</label><input class="input" id="ev_tit" data-draft="ev_tit" maxlength="80" value="${esc(draft("ev_tit"))}"></div>
      <div class="field"><label for="ev_det">Detalles (opcional)</label><textarea class="input" id="ev_det" data-draft="ev_det">${esc(draft("ev_det"))}</textarea></div>
      <p class="muted small" style="margin:-6px 0 10px">La administración lo verá tal cual: usa iniciales, no nombres.</p>
      <div class="row"><button class="btn" data-a="ev-add">Guardar cambios</button><button class="btn ghost" data-a="modal-cerrar">Cancelar</button></div>`;
  }

    tit = fmtLong(m.f);
    cuerpo = its.length ? its.map(x=>`<div class="res" style="grid-template-columns:1fr"><div><span class="tag ${x.tipo==="cumple"?"plantilla":"abierto"}">${x.tipo==="cumple"?"Cumpleaños":"Evento"}</span></div><div style="font-weight:700">${esc(x.texto)}</div>${x.tipo==="evento" && (x.hora || x.varios) ? `<div class="small muted">${esc(x.varios ? x.cuando : "A las "+x.hora)}</div>` : ""}${x.repite?`<div class="small" style="color:var(--accent);font-weight:700">↻ ${esc(x.repite)}</div>`:""}${puede(x)?`<div><button class="link" data-a="ev-edit" data-id="${x.id}">Editar</button></div>`:""}${x.detalle?`<div class="small">${esc(x.detalle).replace(/\n/g,"<br>")}</div>`:""}</div>`).join("") : `<p class="muted">No hay nada este día.</p>`;
    const nEf = verEfem() ? efCuenta(mdDe(m.f)) : 0;
    if (nEf){ const l = efItems(mdDe(m.f)); if (!its.length) cuerpo = "";
      cuerpo += `<div class="res" style="grid-template-columns:1fr"><div><span class="tag ef">Efemérides</span></div>${l ? l.map(it=>`<div style="font-weight:700">${esc(efTit(it))}</div>`).join("") : `<div class="muted small">Cargando…</div>`}<div><button class="link" data-a="ef-ir" data-f="${m.f}">Leer en Efemérides</button></div></div>`; }
  }
  if (m.tipo==="edit"){
    const r = resById(m.rid), f = m.f, manana = DIAS[wd(addDays(f,1))].toLowerCase(), v = S.drafts.ed || norm();
    const seg = (k, opts) => `<div class="seg" role="group">${opts.map(([val,l])=>`<button class="opt" data-a="ed-set" data-k="${k}" data-v="${val}" aria-pressed="${String(v[k])===val}">${l}</button>`).join("")}</div>`;
    const yn = k => seg(k, [["false","No"],["true","Sí"]]);
    tit = "Corregir: " + ((r||{}).nombre||"");
    cuerpo = `<p class="muted small" style="margin-top:0">Parte del ${esc(fmtLong(f).toLowerCase())}. ${locked(f) ? "<b>Este parte ya está cerrado</b>: el cambio se reflejará al momento en el parte de la administración." : "El parte todavía está abierto."}</p>
      <div class="q"><h3>Comida</h3>${seg("comida", COMIDA)}${v.comida==="bolsa" ? `<div class="hora"><label for="ed_hora">Hora de la bolsa</label><input class="input" type="time" id="ed_hora" data-draft="ed_hora" value="${esc(draft("ed_hora", v.horaBolsa||"14:00"))}"></div>` : ""}</div>
      <div class="q"><h3>Cena</h3>${yn("cena")}</div>
      <div class="q"><h3>Desayuno del ${esc(manana)}</h3>${yn("desayuno")}</div>
      <div class="q"><h3>Se lleva el ${esc(manana)}</h3>${seg("llevar", LLEVAR)}</div>
      ${locked(f) ? `<label style="display:flex;gap:10px;align-items:center;margin:14px 0 4px;font-weight:700;cursor:pointer"><input type="checkbox" data-a="ed-aviso" ${S.drafts.ed_aviso!==false?"checked":""} style="width:22px;height:22px;accent-color:var(--primary)"> Avisar a la administración con una nota</label><p class="muted small" style="margin:0 0 10px 32px">Se enviará con las iniciales (${esc(iniciales(r||{}))}), nunca con el nombre.</p>` : ""}
      <div class="row" style="margin-top:12px"><button class="btn" data-a="ed-guardar">Guardar corrección</button><button class="btn ghost" data-a="modal-cerrar">Cancelar</button></div>`;
  }
  return `<div class="modal-velo" data-a="modal-cerrar"></div><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(tit)}"><div class="modal-h"><h2>${esc(tit)}</h2><button class="cerrar" data-a="modal-cerrar" aria-label="Cerrar">×</button></div>${cuerpo}</div>`;
}

/* --- Notas entre administración y administrador --- */
function unread(role){ return S.mensajes.filter(m=>m.para===role && !m.leido).length; }
function diaChat(f){ const h = today(); return f===h ? "Hoy" : f===addDays(h,-1) ? "Ayer" : fmtLong(f); }
const hhmm = t => { const d = new Date(t||0); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
/* Formulario para borrar en bloque por fecha (notas y mensajes de residentes) */
function borrarPorFechaHTML(pre, que, n){
  const f = draft(pre+"_f", today()), modo = draft(pre+"_m", "hasta");
  return `<details class="plegable no-print" ${S.drafts[pre+"_open"]?"open":""}><summary data-a="plegar" data-v="${pre}_open">Borrar ${que} por fecha</summary>
    <div class="field"><label for="${pre}_f">Fecha</label><input class="input" type="date" id="${pre}_f" data-draft="${pre}_f" max="${today()}" value="${esc(f)}" style="max-width:220px"></div>
    <div class="field"><label>Qué borrar</label><div class="seg"><button class="opt" data-a="bf-modo" data-f="${pre}" data-v="dia" aria-pressed="${modo==="dia"}">Solo ese día</button><button class="opt" data-a="bf-modo" data-f="${pre}" data-v="hasta" aria-pressed="${modo==="hasta"}">Ese día y todos los anteriores</button></div></div>
    <p class="muted small" style="margin-top:0">Coinciden ahora: <b>${n}</b>. Se borran para todos y no se puede deshacer.</p>
    ${S.drafts[pre+"_ok"] ? `<div class="row"><button class="btn danger" data-a="bf-do" data-f="${pre}">Sí, borrar ${n}</button><button class="btn ghost" data-a="bf-no" data-f="${pre}">Cancelar</button></div>` : `<button class="btn danger" data-a="bf-ask" data-f="${pre}" ${n?"":"disabled"}>Borrar</button>`}</details>`;
}
const enFecha = (ts, f, modo) => { const d = iso(new Date(ts||0)); return modo==="dia" ? d===f : d<=f; };
function notasDeChat(role){ const otro = role==="admin" ? "cocina" : "admin"; return S.mensajes.filter(m=>(m.de===role&&m.para===otro)||(m.de===otro&&m.para===role)); }
const avisosParteSinLeer = role => S.mensajes.filter(m=>m.para===role && m.fecha && !m.leido);
function quienNota(m){ return m.de==="admin" ? "Administradores" : "Administración"; }
function notasView(role){
  const esA = role==="admin";
  const cargo = resById(principalHoy()) ? nombreVis(resById(principalHoy())) : "";
  const aviso = `<p class="muted small" style="margin-top:0">${role==="cocina" ? `Lo que escribís lo ven todos los administradores${cargo?". Hoy está al cargo "+esc(cargo):""}. Aquí os llegan también los avisos para el parte (📌).` : "Solo con la administración (los residentes no lo ven). Usa siempre iniciales: lo ven tal cual. Los avisos para un parte concreto se ponen en «Parte del día» y también llegan aquí."} Toca un mensaje para responderlo.</p>`;
  const todas = notasDeChat(role), list = todas.slice(-80), ids = new Set(todas.map(m=>m.id));
  let dia = "", html = "";
  list.forEach(m=>{
    const f = iso(new Date(m.ts||0));
    if (f!==dia){ dia = f; html += `<div class="chat-dia">${esc(diaChat(f))}</div>`; }
    const mia = m.de===role, sel = S.notaSel===m.id;
    const cita = m.resp ? `<button class="cita" data-a="ir-nota" data-id="${esc(m.resp.id)}"><b>${esc(m.resp.de==="admin"?"Administradores":"Administración")}</b>${esc(String(m.resp.t||"").slice(0,140))}${String(m.resp.t||"").length>140?"…":""}${ids.has(m.resp.id)?"":' <span class="muted">(ya borrado)</span>'}</button>` : "";
    const acc = sel && !S.vista ? `<div class="chat-acc">${S.drafts.ntDel===m.id ? `<span>¿Borrar para todos?</span><button class="link" style="color:var(--danger)" data-a="nt-del" data-id="${m.id}">Sí, borrar</button><button class="link" data-a="nt-del-no">No</button>`
      : `<button class="link" data-a="resp-set" data-id="${m.id}">↩ Responder</button>${esA ? `<button class="link" style="color:var(--danger)" data-a="nt-del-ask" data-id="${m.id}">Borrar</button>` : ""}`}</div>` : "";
    const ap = m.fecha ? `<div class="chat-ap">📌 Aviso para el parte del ${esc(fmtLong(m.fecha).toLowerCase())}</div>` : "";
    const verParte = m.fecha && sel ? `<button class="link" data-a="parte-ir" data-f="${m.fecha}">Ver el parte</button>` : "";
    html += `<div class="note ${mia?"mine":""} ${m.fecha?"es-ap":""} ${sel?"elegida":""}" id="n-${m.id}" data-a="nota-sel" data-id="${m.id}"><div class="meta">${quienNota(m)}, ${hhmm(m.ts)}${mia?(m.leido?" · Leída":" · Sin leer"):""}</div>${ap}${cita}${esc(m.texto).replace(/\n/g,"<br>")}${verParte ? `<div class="chat-acc">${verParte}</div>` : ""}${acc}</div>`;
  });
  const borrar = esA && !S.vista ? borrarPorFechaHTML("nb", "notas", todas.filter(m=>enFecha(m.ts, draft("nb_f", today()), draft("nb_m","hasta"))).length) : "";
  return aviso + (todas.length>list.length ? `<p class="muted small" style="text-align:center">Se muestran las ${list.length} notas más recientes de ${todas.length}.</p>` : "")
    + `<div class="chat">${html || `<div class="empty">Todavía no hay notas. Escribe abajo para empezar.</div>`}</div><div id="notas-fin"></div>` + borrar
    + `<div aria-hidden="true" style="height:${S.drafts.msgResp ? 120 : 70}px"></div>`;
}
/* Barra de escribir, fija abajo como en WhatsApp (va dentro de la barra de navegación) */
function barraChat(role){
  const r = S.drafts.msgResp ? S.mensajes.find(m=>m.id===S.drafts.msgResp) : null;
  const txt = draft("msg"), filas = Math.min(4, Math.max(1, txt.split("\n").length + Math.floor(txt.length/38)));
