<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libro de comidas - Mizar</title>
<meta name="theme-color" content="#2E5E4E">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mizar">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --ink:#1C2621; --muted:#58685F; --line:#D2DCD5;
  --primary:#2E5E4E; --primary-ink:#FFFFFF; --soft:#DFEBE3;
  --accent:#B9791A; --accent-soft:#F5E8CF; --danger:#A23B2C; --danger-soft:#F6DED9;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --head:"Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111714; --surface:#19211D; --ink:#E4ECE7; --muted:#9BAAA1; --line:#2B3731;
    --primary:#80C2A7; --primary-ink:#0E1A15; --soft:#21302A;
    --accent:#E2B357; --accent-soft:#3A301E; --danger:#E7897A; --danger-soft:#3B221E;
  }
}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211D; --ink:#E4ECE7; --muted:#9BAAA1; --line:#2B3731;
  --primary:#80C2A7; --primary-ink:#0E1A15; --soft:#21302A;
  --accent:#E2B357; --accent-soft:#3A301E; --danger:#E7897A; --danger-soft:#3B221E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body{-webkit-tap-highlight-color:transparent}
.seg,.bnav,.hoja,.cal,.days .day-head{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 110px}
/* Barra de navegación inferior */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(0,0,0,.08);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav-in{display:flex;max-width:760px;margin:0 auto}
.bn{flex:1 1 0;min-width:0;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;color:var(--muted);font-size:12px;font-weight:700;position:relative;line-height:1.15;text-align:center}
.bn .ico{display:grid;place-items:center;width:58px;height:32px;border-radius:999px}
.bn svg{width:24px;height:24px}
.bn[aria-current="true"]{color:var(--primary)}
.bn[aria-current="true"] .ico{background:var(--soft)}
.bn .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0}
.velo{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:18}
.hoja{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:19;padding:0 10px}
.hoja-in{max-width:740px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.hoja-t{font-family:var(--head);font-weight:600;font-size:15px;color:var(--muted);margin:0 4px 10px}
.hoja-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hb{background:var(--bg);border:2px solid transparent;border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13.5px;color:var(--ink);position:relative;text-align:center;line-height:1.2}
.hb svg{width:26px;height:26px;color:var(--primary)}
.hb[aria-current="true"]{border-color:var(--primary)}
.hb .badge{position:absolute;top:6px;right:8px}
.sec-t{font-size:26px;margin:2px 0 14px}
.modal-velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;width:min(92vw,520px);max-height:82vh;overflow:auto;background:var(--surface);border-radius:18px;padding:18px 18px 16px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.modal-h h2{font-size:21px}
.cerrar{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:20px;line-height:1;color:var(--muted)}
.mes-t{font-family:var(--head);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:18px 2px 8px}
button.cal-d{text-align:left;cursor:pointer;color:inherit;font:inherit}
button.cal-d:hover{border-color:var(--primary)}
.editado{font-size:12px;color:var(--accent);font-weight:700}
tr.fila-ed{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
tr.fila-ed:hover td,tr.fila-ed:active td{background:var(--soft)}
.lapiz{color:var(--primary);font-weight:700}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
h1{font-size:30px;font-weight:750;letter-spacing:-.01em}
h2{font-size:22px;font-weight:750}
h3{font-size:17px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:23px;line-height:1.05}
.marca{display:block;font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-top:3px}
.who{font-size:15px;color:var(--muted)}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--primary);background:var(--primary);color:var(--primary-ink);font-family:var(--head);font-weight:700;font-size:16px;display:grid;place-items:center;padding:0}
.avatar[aria-expanded="true"]{background:var(--surface);color:var(--primary)}
.cuenta{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;margin:-4px 0 16px}
.cuenta .yo{font-weight:700;padding:2px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.cuenta .yo small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.cuenta button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:11px 10px;font-weight:700;color:var(--primary)}
.cuenta button:hover{background:var(--soft)}
.cuenta button.salir{color:var(--danger)}
.link{background:none;border:0;padding:6px 0;color:var(--primary);text-decoration:underline;text-underline-offset:3px}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.nav-chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-bottom:20px}
.chip{padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;text-align:center}
.chip[aria-current="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.menu-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 16px;border-radius:12px;border:2px solid var(--primary);background:var(--surface);font-family:var(--head);font-weight:600;font-size:19px;text-align:left}
.menu-panel{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.menu-g{font-size:13px;color:var(--muted);font-weight:700;margin:8px 2px 6px;text-transform:uppercase;letter-spacing:.04em}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
#print-area{display:none}
.tab{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--primary)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;line-height:20px;text-align:center;margin-left:6px}

/* Login */
.cover{min-height:100%;display:grid;place-items:center;padding:24px 0}
.cover-inner{width:100%;max-width:440px}
.cover h1{font-size:40px;margin-bottom:6px}
.cover .lead{color:var(--muted);margin:0 0 28px}
.roles{display:grid;gap:10px}
.role{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px 18px}
.role strong{display:block;font-family:var(--head);font-size:19px}
.role span{color:var(--muted);font-size:15px}
.role:hover{border-color:var(--primary)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0 20px}
.name{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.name[aria-pressed="true"]{border-color:var(--primary);background:var(--soft)}

/* Forms */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:15px}
.input{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.input::placeholder{color:var(--muted);opacity:.8}
select.input option{background:var(--surface);color:var(--ink)}
:root{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
.input:focus{border-color:var(--primary);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;border:2px solid var(--primary);background:var(--primary);color:var(--primary-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.danger{border-color:var(--danger);background:transparent;color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--danger);font-weight:700;margin:8px 0}

/* Week */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weeknav h2{font-size:19px;text-align:center}
.arrow{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.days{display:grid;gap:8px}
.day{background:var(--surface);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.day.today{border-color:var(--primary)}
.day-head{width:100%;display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:none;border:0;text-align:left}
.day-name{font-family:var(--head);font-weight:600;font-size:17px;line-height:1.1}
.day-name small{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted)}
.day-sum{font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.plantilla{background:var(--accent-soft);color:var(--accent)}
.tag.cerrado{background:var(--line);color:var(--muted)}
.tag.abierto{background:var(--soft);color:var(--primary)}
.day.locked .day-head{opacity:.75}
.editor{padding:4px 14px 16px;border-top:1px solid var(--line)}
.q{padding:12px 0 4px}
.q > h3{margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:9px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.opt[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.opt:disabled,.opt[aria-disabled="true"]{cursor:not-allowed;opacity:.45;background:var(--bg);border-style:dashed}
.opt[aria-pressed="true"][aria-disabled="true"]{opacity:.6;background:var(--muted);border-color:var(--muted);color:var(--surface);border-style:solid}
.q.bloq h3::after{content:" · cerrado";font-family:var(--body);font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input:disabled{opacity:.5}
.arrow:disabled{opacity:.35}
.hora{display:flex;align-items:center;gap:10px;margin-top:10px}
.hora input{max-width:140px}
.editor-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}

/* Parte */
.status{border-radius:12px;padding:12px 14px;margin:0 0 16px;font-weight:700}
.status.prov{background:var(--accent-soft);color:var(--accent)}
.status.def{background:var(--soft);color:var(--primary)}
.blocks{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:24px}
.block{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.block h3{font-size:18px;margin-bottom:8px}
.count{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.count:last-of-type{border-bottom:0}
.count b{font-family:var(--head);font-size:24px;font-weight:750;font-variant-numeric:tabular-nums}
.reg{font-size:14px;color:var(--danger);margin:-2px 0 6px}
.reg-label{font-weight:700}
.list{margin:6px 0 0;padding:0;list-style:none;font-size:15px}
.list li{padding:3px 0}
.tablewrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--head);font-weight:600;background:var(--soft)}
tr:last-child td{border-bottom:0}
.tabla-qc th,.tabla-qc td{white-space:normal;padding:9px 8px;font-size:15px;vertical-align:top}
.tabla-qc th:nth-child(2),.tabla-qc td:nth-child(2),.tabla-qc th:nth-child(4),.tabla-qc td:nth-child(4){text-align:center;width:15%}
@media (max-width:520px){.tabla-qc th,.tabla-qc td{font-size:14px;padding:8px 6px}}
.regcell{color:var(--danger);font-size:13px;display:block}

/* Notes */
.notes{display:grid;gap:10px;margin-top:18px}
.note{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;max-width:88%}
.note.mine{justify-self:end;background:var(--soft);border-color:transparent}
.note .meta{font-size:13px;color:var(--muted);margin-bottom:4px}
.note.unread{border-color:var(--accent)}
textarea.input{min-height:90px;resize:vertical}
.alert{background:var(--accent-soft);color:var(--ink);border-left:5px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:16px}

/* Residents admin */
.res{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.res.off{opacity:.55}
.panel{background:var(--surface);border:2px solid var(--primary);border-radius:14px;padding:16px;margin-bottom:16px}


/* Palabra del día */
.wl-board{display:grid;gap:6px;justify-content:center;margin:8px 0 16px}
.wl-row{display:grid;grid-template-columns:repeat(5,52px);gap:6px}
.wl-c{height:52px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-family:var(--head);font-weight:750;font-size:24px;text-transform:uppercase;background:var(--surface)}
.wl-c.c,.wl-k.c,.mini i.c{background:#3E8E5E;border-color:#3E8E5E;color:#fff}
.wl-c.p,.wl-k.p,.mini i.p{background:#C49A1E;border-color:#C49A1E;color:#fff}
.wl-c.a,.wl-k.a,.mini i.a{background:#7C8A83;border-color:#7C8A83;color:#fff}
.wl-kb{display:grid;gap:6px;max-width:520px;margin:0 auto 22px}
.wl-kr{display:flex;gap:4px;justify-content:center}
.wl-k{flex:1;min-width:0;height:50px;border:0;border-radius:6px;background:var(--line);color:var(--ink);font-weight:700;text-transform:uppercase;padding:0;font-size:16px}
.wl-k.wide{flex:1.7;font-size:12px}
.mini{display:inline-grid;grid-template-columns:repeat(5,10px);gap:2px;vertical-align:middle}
.mini i{width:10px;height:10px;border-radius:2px;display:block;background:var(--line)}
/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:18px}
.cal-h{font-size:12px;color:var(--muted);text-align:center;font-weight:700}
.cal-d{min-height:66px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;font-size:12px;overflow:hidden}
.cal-d.vacio{background:transparent;border-color:transparent}
.cal-d.hoy{border:2px solid var(--primary)}
.cal-n{font-weight:700}
.cal-i{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:0 3px;margin-top:2px;font-size:11px}
.cal-i.cumple{background:var(--accent-soft);color:var(--accent)}
.cal-i.evento{background:var(--soft);color:var(--primary)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;max-width:90vw;z-index:10}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}

@media (max-width:520px){
  h1{font-size:26px}
  .day-head{grid-template-columns:78px 1fr}
  .day-head .tagcol{grid-column:2}
  .blocks{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .bnav,.hoja,.velo,.sec-t{display:none!important}
  #app{display:none!important}
  #print-area{display:block!important}
  body{background:#fff;color:#000;font-size:12px}
  .top,.tabs,.no-print,.toast{display:none!important}
  .block,.tablewrap{border-color:#999}
  .blocks{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Abriendo el libro…</p></div>
<script>
window.addEventListener("error", e => { const a = document.getElementById("app"); if (a) a.innerHTML = '<h1>Error al iniciar</h1><p>' + String(e.message || e.error || "desconocido").replace(/</g,"&lt;") + '</p>'; });
window.addEventListener("unhandledrejection", e => { const a = document.getElementById("app"); if (a) a.innerHTML += '<p class="muted small">Aviso técnico: ' + String((e.reason && (e.reason.code || e.reason.message)) || e.reason).replace(/</g,"&lt;") + '</p>'; });
</script>
<div id="toast" class="toast" hidden></div>
<div id="print-area"></div>
<script type="module">
/* ---------- Conexión con Firebase ---------- */

import { initializeFirestore, doc as fdoc, collection as fcol, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot as fsnap, query, where as fwhere, writeBatch, deleteField, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FB_CONFIG = {
  apiKey: "AIzaSyA5dr_N0Z8VqiRWTCDMHbrRsmK6gFsUDBM",
  authDomain: "libro-comidas-mizar.firebaseapp.com",
  projectId: "libro-comidas-mizar",
  storageBucket: "libro-comidas-mizar.firebasestorage.app",
  messagingSenderId: "574865497497",
  appId: "1:574865497497:web:ec6708809617672cd50708"
};
const DOMINIO = "libro-comidas-mizar.app";

const fbApp = initializeApp(FB_CONFIG);
const auth = getAuth(fbApp);
const fs = initializeFirestore(fbApp, {ignoreUndefinedProperties:true});
let secAuth = null;
function authSecundaria(){ if (!secAuth) secAuth = initializeAuth(initializeApp(FB_CONFIG, "altas"), {persistence: inMemoryPersistence}); return secAuth; }
const emailNuevo = u => u + "." + Date.now().toString(36) + "@" + DOMINIO;

const wrap = s => ({id:s.id, exists:s.exists(), data:()=>s.data()});
function mkDoc(path){ const r = fdoc(fs, path); return {id:r.id, path,
  get: async()=>wrap(await getDoc(r)), set:d=>setDoc(r,d), update:d=>updateDoc(r,d), delete:()=>deleteDoc(r),
  onSnapshot:(n,e)=>fsnap(r, s=>n(wrap(s)), e)}; }
function mkCol(path, cons=[]){ const base = fcol(fs, path), q = cons.length ? query(base, ...cons) : base; return {
  where:(f,op,v)=>mkCol(path,[...cons, fwhere(f,op,v)]), doc:id=>mkDoc(path+"/"+id),
  get: async()=>{ const s = await getDocs(q); return {docs:s.docs.map(wrap)}; },
  onSnapshot:(n,e)=>fsnap(q, s=>n({docs:s.docs.map(wrap)}), e)}; }

const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const wd = s => (parse(s).getDay()+6)%7;
const today = () => iso(new Date());
const mondayOf = s => addDays(s,-wd(s));
const fmtDay = s => { const d = parse(s); return d.getDate()+" de "+MESES[d.getMonth()]; };

/* Hora límite: 1) día especial (festivo…), 2) hora de ese día de la semana, 3) valores por defecto */
const horaSemana = i => { const c = S.config||{}, h = (c.horasDia||{})[i]; return h || (i>=5 ? (c.horaCierreFinde || "10:30") : (c.horaCierre || "09:30")); };

function efectiva(rid,f){
  const p = S.pedidos[f+"_"+rid];
  if (p) return {sel:norm(p), fuente:"pedido", editadoPor:p.editadoPor};
  const t = S.plantillas[rid] && S.plantillas[rid]["d"+wd(f)];
  if (t) return {sel:norm(t), fuente:"plantilla"};
  return {sel:norm(), fuente:"vacio"};
}
function resumen(sel, f){
  const manana = f ? DIAS[wd(addDays(f,1))].toLowerCase() : "día siguiente";
  const p = [];
  if (sel.comida!=="no") p.push("Comida: "+comidaTxt(sel).toLowerCase());
  if (sel.cena) p.push("cena");
  if (sel.desayuno) p.push("desayuno del "+manana);
  if (sel.llevar!=="nada") p.push(sel.llevar+" para el "+manana);
  if (!p.length) return "Sin servicios";
  const s = p.join(", ");
  return s.charAt(0).toUpperCase()+s.slice(1);
}

function diasHasta(mmdd){
  if (!mmdd) return 9999;
  const [m,d] = mmdd.split("-").map(Number), hoy = parse(today());

  return Math.round((c - hoy)/86400000);
}

let toastTimer;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,3200); }
async function w(fn){
  try { await fn(); }
  catch(e){
    if (e && e.code==="unavailable"){ try { await new Promise(r=>setTimeout(r,600+Math.random()*600)); await fn(); return; } catch(e2){ e=e2; } }
    toast("No se ha podido guardar. Inténtalo de nuevo.");
  }
}
const dbErr = e => { console.error(e); if (!S.resLoaded) { S.loadErr = (e && (e.code || e.message)) || "desconocido"; render(); } };
S.db = { doc: mkDoc, collection: c => mkCol(c) };
let subs = [];
function limpiar(){
  subs.forEach(u=>{ try { u(); } catch(e){} }); subs = [];
  Object.assign(S, {session:null, resLoaded:false, pub:{}, priv:{}, nom:{}, consultas:[], avisos:[], avIds:undefined, cqTs:undefined, cqOpen:null, evIds:undefined, evA:{}, evM:{}, residentes:[], plantillas:{}, pedidos:{}, extras:{}, wordle:{}, eventos:[], mensajes:[], msgIds:undefined, extrasCargados:false, prevPedir:undefined, loadErr:null, tab:null, editRes:null, perfilAplazado:false, wlTyped:"", verPw:false, vista:false, menu:false, migrado:false});
}
function mezclar(){
  const sinNombres = S.miRol==="cocina";
  S.residentes = Object.entries(S.pub).map(([id,p])=>{ const r = {id, ...p, ...(S.nom[id]||{}), ...(S.priv[id]||{})}; if (sinNombres){ delete r.nombre; delete r.usuario; } return r; }).sort((a,b)=>String(a.nombre||a.iniciales||"").localeCompare(String(b.nombre||b.iniciales||""),"es"));
}
function revisarPeticion(){
  const yo = S.session && resById(S.session.uid);
  if (yo && S.prevPedir!==undefined && yo.pedirGustos && yo.pedirGustos!==S.prevPedir && pideActualizar(yo)){ S.perfilAplazado=false; toast("La administración te pide que actualices tus gustos."); }
  S.prevPedir = yo ? (yo.pedirGustos||0) : undefined;
}
function suscribir(pid, rol){
  S.miRol = rol;
  const add = u => subs.push(u), gest = rol==="admin" || rol==="cocina";
  add(S.db.collection("usuarios").onSnapshot(q => {
    const o = {}; q.docs.forEach(d=>o[d.id]=d.data()); S.pub = o; S.resLoaded = true; mezclar();
    if (!o[pid] || o[pid].activo===false){ toast("Tu usuario ya no está activo."); signOut(auth); return; }
    revisarPeticion(); render();
    if (rol==="admin" && !S.migrado){ S.migrado = true; setTimeout(migrarNombres, 2500); setTimeout(()=>limpiarAntiguos(false), 6000); }
  }, dbErr));
  if (rol!=="cocina") add(S.db.collection("nombres").onSnapshot(q => { const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.nom=o; mezclar(); render(); }, dbErr));
  if (gest) add(S.db.collection("privados").onSnapshot(q => { const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.priv=o; mezclar(); revisarPeticion(); render(); }, dbErr));
  else add(S.db.doc("privados/"+pid).onSnapshot(s => { S.priv = s.exists ? {[pid]: s.data()} : {}; mezclar(); revisarPeticion(); render(); }, dbErr));
  add(S.db.collection("plantillas").onSnapshot(q => { const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.plantillas=o; render(); }, dbErr));
  add(S.db.collection("pedidos").where("fecha",">=",addDays(today(),-28)).onSnapshot(q => { const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.pedidos=o; render(); }, dbErr));
  add(S.db.collection("extras").where("fecha",">=",addDays(today(),-28)).onSnapshot(q => {
    const prev = S.extrasCargados; const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.extras=o; S.extrasCargados = true;
    const me = S.session && resById(S.session.uid);
    if (prev && me && rolDe(me)==="residente") avisosResidente().filter(x=>!x.visto).slice(0,1).forEach(x=>toast("Nuevo aviso para el "+fmtLong(x.fecha).toLowerCase()+"."));
    render();
  }, dbErr));
  const ordenEv = l => l.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
  if (gest) add(S.db.collection("eventos").onSnapshot(q => {
    const prev = S.evIds; S.eventos = ordenEv(q.docs.map(d=>({id:d.id, ...d.data()}))); S.evIds = new Set(S.eventos.map(e=>e.id));
    if (prev && rol==="admin" && S.eventos.some(e=>!prev.has(e.id) && e.estado==="pendiente")) toast("Un residente ha propuesto un evento para el calendario.");
    render();
  }, dbErr));
  else {
    const junta = () => { S.eventos = ordenEv(Object.values({...(S.evA||{}), ...(S.evM||{})})); render(); };
    add(S.db.collection("eventos").where("estado","==","aprobado").onSnapshot(q => { const o={}; q.docs.forEach(d=>o[d.id]={id:d.id, ...d.data()}); S.evA=o; junta(); }, dbErr));
    add(S.db.collection("eventos").where("autor","==",pid).onSnapshot(q => { const o={}; q.docs.forEach(d=>o[d.id]={id:d.id, ...d.data()}); S.evM=o; junta(); }, dbErr));
  }
  /* Conversaciones de residentes con los administradores */
  if (rol!=="cocina"){
    const cq = rol==="admin" ? S.db.collection("consultas") : S.db.collection("consultas").where("autor","==",pid);
    add(cq.onSnapshot(q => {
      const prev = S.cqTs || {}; S.consultas = q.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.ultimoTs||0)-(a.ultimoTs||0));
      const ahora = {}; S.consultas.forEach(c=>ahora[c.id]=c.ultimoTs||0);
      if (S.cqTs) S.consultas.forEach(c=>{ if ((c.ultimoTs||0) > (prev[c.id]||0)){ const ult = (c.mensajes||[]).slice(-1)[0]; if (ult && ult.quien!==pid) toast(rol==="admin" ? "Nuevo mensaje de un residente." : "Los administradores te han respondido."); } });
      S.cqTs = ahora;
      caducarConsultas();
      render();
    }, dbErr));
  }
  if (rol!=="cocina") add(S.db.collection("avisos").where("hasta",">=",today()).onSnapshot(q => {
    const prev = S.avIds; S.avisos = q.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0)); S.avIds = new Set(S.avisos.map(a=>a.id));
    if (prev && rol==="residente" && S.avisos.some(a=>!prev.has(a.id))) toast("Nuevo aviso de los administradores.");
    render();
  }, dbErr));
  if (rol!=="cocina") add(S.db.collection("wordle").where("fecha",">=",addDays(today(),-62)).onSnapshot(q => { const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.wordle=o; render(); }, dbErr));
  if (gest){
    add(S.db.collection("mensajes").onSnapshot(q => {
      const prev = S.msgIds;
      S.mensajes = q.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));
      S.msgIds = new Set(S.mensajes.map(m=>m.id));
      if (prev) S.mensajes.filter(m=>!prev.has(m.id) && m.para===rol && !m.leido).forEach(notificar);
      render();
    }, dbErr));
  }
}
/* ---------- Historial: borrar datos antiguos ---------- */
async function borrarHistorial(limite){
  const limiteMs = parse(limite).getTime(); let total = 0;
  const grupos = [["pedidos", fwhere("fecha","<",limite)], ["extras", fwhere("fecha","<",limite)], ["wordle", fwhere("fecha","<",limite)], ["eventos", fwhere("fecha","<",limite)], ["mensajes", fwhere("ts","<",limiteMs)]];
  for (const [col, cond] of grupos){
    const snap = await getDocs(query(fcol(fs, col), cond));
    for (let i=0; i<snap.docs.length; i+=400){ const b = writeBatch(fs); snap.docs.slice(i,i+400).forEach(d=>b.delete(d.ref)); await b.commit(); }
    total += snap.docs.length;
  }
  await S.db.doc("config/general").update({ultimaLimpieza: today(), ultimaLimpiezaBorrados: total});
  return total;
}
/* Automático: si está activado, cada trimestre se borra lo que tenga más de 3 meses */
async function limpiarAntiguos(){
  const c = S.config || {};
  if (!c.limpiezaAuto) return;
  if (c.ultimaLimpieza && c.ultimaLimpieza > addDays(today(), -91)) return;
  try { await borrarHistorial(addDays(today(), -91)); } catch(e){ console.warn("Limpieza automática:", e); }
}

/* Paso de los nombres a su propia colección (solo una vez, lo hace el administrador principal) */
async function migrarNombres(manual){
  const me = resById(S.session && S.session.uid);
  if (!me || !puedeGestionarAdmins(me)){ if (manual) toast("Solo el administrador principal puede hacerlo."); return; }
  const viejos = Object.entries(S.pub).filter(([id,p])=>("nombre" in p) || ("usuario" in p) || !p.iniciales);
  const sinCumple = Object.keys(S.pub).filter(id=>(S.priv[id]||{}).cumple && (S.nom[id]||{}).cumple !== S.priv[id].cumple && !viejos.some(v=>v[0]===id));
  const evViejos = S.eventos.filter(e=>!e.estado);
  if (!viejos.length && !sinCumple.length && !evViejos.length) return;
  try {
    const b = writeBatch(fs);
    viejos.forEach(([id,p])=>{
      const nombre = p.nombre || (S.nom[id]||{}).nombre || "", usuario = p.usuario || (S.nom[id]||{}).usuario || "";
      if (nombre || usuario) b.set(fdoc(fs,"nombres/"+id), {nombre, usuario}, {merge:true});
      const upd = {iniciales: p.iniciales || inicialesDe(nombre)};
      if ("nombre" in p) upd.nombre = deleteField();
      if ("usuario" in p) upd.usuario = deleteField();
      b.update(fdoc(fs,"usuarios/"+id), upd);
      if ((S.priv[id]||{}).cumple) b.set(fdoc(fs,"nombres/"+id), {cumple:S.priv[id].cumple}, {merge:true});
    });
    sinCumple.forEach(id=>b.set(fdoc(fs,"nombres/"+id), {cumple:S.priv[id].cumple}, {merge:true}));
    evViejos.forEach(e=>b.update(fdoc(fs,"eventos/"+e.id), {estado:"aprobado"}));
    await b.commit();
    if (manual) toast("Nombres protegidos correctamente.");
  } catch(e){ console.warn("Migración de nombres:", e); if (manual) toast("No se ha podido completar ("+(e.code||e.message)+"). Envía una captura al responsable."); }
}

}

const SERV_REG = [["comida","Comida"],["cena","Cena"],["desayuno","Desayuno"],["llevar","Para llevar"]];
const regAplica = (r, srv) => !!r.regimen && (!r.regimenEn || r.regimenEn[srv] !== false);
function regAmbito(r){
  if (!r.regimen || !r.regimenEn) return "";
  const si = SERV_REG.filter(([k])=>r.regimenEn[k]!==false).map(([k,l])=>l.toLowerCase());
  return si.length===SERV_REG.length ? "" : si.length ? " (solo "+si.join(" y ")+")" : " (no se aplica)";
}
function regTxt(list, anon, srv){
  const x = list.filter(o=>regAplica(o.r, srv||"comida"));
  if (!x.length) return "";
  return anon ? "Con régimen: "+x.map(o=>iniciales(o.r)).join(", ") : "Régimen: "+x.map(o=>o.r.nombre+" ("+o.r.regimen+")").join(", ");
}
function bolsasPorHora(bolsas, extraB, anon){
  const by = {};
  bolsas.forEach(o=>{ const h=o.sel.horaBolsa||"Sin hora"; (by[h]=by[h]||{l:[],e:0}).l.push(o); });
  Object.entries(extraB||{}).forEach(([h,n])=>{ if (n>0) (by[h]=by[h]||{l:[],e:0}).e += n; });
  return Object.keys(by).sort().map(h=>{
    const {l,e} = by[h], n = l.length+e, parts = [];
    if (anon){ if (e) parts.push(e+" extra"); const r=l.filter(o=>regAplica(o.r,"comida")); if (r.length) parts.push("con régimen: "+r.map(o=>iniciales(o.r)).join(", ")); }
    else { l.forEach(o=>parts.push(o.r.nombre+(regAplica(o.r,"comida")?" ("+o.r.regimen+")":""))); if (e) parts.push(e+" extra"); }
    return {h, n, det: parts.join(anon?"; ":", ")};
  });
}

/* --- Palabra del día --- */
function palabraDe(f){ const d = Math.round((parse(f) - new Date(2026,0,1))/86400000), n = WL_SOL.length; return WL_SOL[((d*7919) % n + n) % n]; }
function evaluar(g, sol){
  const r = Array(5).fill("a"), cnt = {};
  for (let i=0;i<5;i++){ if (g[i]===sol[i]) r[i]="c"; else cnt[sol[i]]=(cnt[sol[i]]||0)+1; }
  for (let i=0;i<5;i++){ if (r[i]!=="c" && cnt[g[i]]>0){ r[i]="p"; cnt[g[i]]--; } }
  return r;
}
const juegoDe = (uid, f) => S.wordle[f+"_"+uid] || {intentos:[], estado:"jugando"};
const mini = (j, f) => `<span class="mini">${j.intentos.map(g=>evaluar(g, palabraDe(f)).map(c=>`<i class="${c}"></i>`).join("")).join("")}</span>`;

  const res = fin ? `<div class="status ${j.estado==="ganado"?"def":"prov"}">${j.estado==="ganado" ? `¡Acertaste en ${j.intentos.length} intento${j.intentos.length>1?"s":""}! Sumas ${j.puntos} punto${j.puntos>1?"s":""}.` : `Hoy no ha podido ser. La palabra era «${sol.toUpperCase()}».`} Mañana, palabra nueva.</div>` : "";

async function wlTecla(k){
  const u = resById(S.session.uid), f = today(), j = juegoDe(u.id, f);
  if (j.estado!=="jugando" || j.intentos.length>=6) return;
  if (k==="back"){ S.wlTyped = S.wlTyped.slice(0,-1); render(); return; }
  if (k==="enter"){
    const g = S.wlTyped;
    if (g.length<5){ toast("Faltan letras."); return; }
    if (!WL_VAL.has(g) && !WL_SOL.includes(g)){ toast("Esa palabra no está en el diccionario."); return; }
    const intentos = [...j.intentos, g], sol = palabraDe(f);
    const estado = g===sol ? "ganado" : intentos.length>=6 ? "perdido" : "jugando";
    const doc = {fecha:f, uid:u.id, intentos, estado, puntos: estado==="ganado" ? 7-intentos.length : 0, ts:Date.now()};
    S.wordle[f+"_"+u.id] = doc; S.wlTyped = ""; render();
    await w(()=>S.db.doc("wordle/"+f+"_"+u.id).set(doc)); return;
  }
  if (/^[a-zñ]$/.test(k) && S.wlTyped.length<5){ S.wlTyped += k; render(); }
}

/* --- Calendario de la residencia --- */
const finEv = e => (e.fin && e.fin>e.fecha) ? e.fin : e.fecha;
function cuandoEv(e){
  const fin = finEv(e);
  if (fin!==e.fecha){
    const a = parse(e.fecha), b = parse(fin);
    return a.getMonth()===b.getMonth() ? `Del ${a.getDate()} al ${b.getDate()} de ${MESES[b.getMonth()]}` : `Del ${fmtDay(e.fecha)} al ${fmtDay(fin)}`;
  }
  return fmtLong(e.fecha) + (e.hora ? ", a las "+e.hora : "");
}
function eventosEntre(desde, hasta){
  const out = [];
  S.eventos.forEach(e=>{
    if ((e.estado||"aprobado")!=="aprobado" || e.fecha>hasta || finEv(e)<desde) return;
    const ini = e.fecha>desde ? e.fecha : desde, fin = finEv(e)<hasta ? finEv(e) : hasta;
    for (let f=ini; f<=fin; f=addDays(f,1)) out.push({fecha:f, tipo:"evento", texto:e.titulo, corto:e.titulo, detalle:e.detalle, id:e.id, autor:e.autor, hora:e.hora, cuando:cuandoEv(e), varios:finEv(e)!==e.fecha});
  });
  for (let f=desde; f<=hasta; f=addDays(f,1)){ const md=f.slice(5); conCumple().forEach(r=>{ if (r.cumple===md) { const e = edadEn(r, Number(f.slice(0,4))), n = nombreVis(r); out.push({fecha:f, tipo:"cumple", texto:"Cumpleaños de "+n+(e!=null?" ("+e+" años)":""), corto:n+(e!=null?" "+e:"")}); } }); }
  return out.sort((a,b)=>a.fecha.localeCompare(b.fecha) || (a.tipo==="cumple"?-1:1));
}

  if (rol!=="cocina") t.push(["datos","Mis datos","",G1]);
  if (rol==="cocina") t.push(["parte","Parte del día","",G2],["cumples","Cumpleaños","",G2],["calendario","Calendario","",G2],["notas","Notas", unread("cocina")||"",G2]);
  if (rol==="admin") t.push(["parte","Parte del día","",G2],["extras","Comensales extra","",G2],["notas","Notas", unread("admin")||"",G2],["consultas","Mensajes de residentes", consultasSinLeer("admin")||"",G2],["avisos","Avisos a residentes","",G2],["cumples","Cumpleaños","",G2],["calendario","Calendario", S.eventos.filter(e=>e.estado==="pendiente").length||"",G2],["usuarios","Usuarios","",G2],["ajustes","Ajustes","",G2]);
  if (!t.length) return cabecera(u.nombre||"") + `<div class="empty">Tu usuario no tiene ninguna función asignada.</div>`;
  if (!t.find(x=>x[0]===S.tab)) S.tab = esComensal(u) ? "semana" : (t.find(x=>x[0]==="parte")||t[0])[0];
  let main;
  if (S.tab==="semana"||S.tab==="plantilla") main = vistaComensal(u);
  else if (S.tab==="parte") main = avisoCumples() + avisoEventos() + parteView();
  else if (S.tab==="wordle") main = wordleView(u);
  else if (S.tab==="calendario") main = calendarioView(rol==="admin" ? "admin" : rol==="cocina" ? "cocina" : "residente");
  else if (S.tab==="avisos") main = avisosAdminView();
  else if (S.tab==="quien") main = quienComeView();
  else if (S.tab==="consultas") main = consultasView(rol==="admin" ? "admin" : "residente");
  else if (S.tab==="datos") main = datosView(u);
  else if (S.tab==="cumples") main = cumplesView();
  else if (S.tab==="notas") main = notasView(rol);
  else if (S.tab==="extras") main = extrasView();
  else if (S.tab==="usuarios") main = usuariosView();
  else main = ajustesView();
  const nuevas = !S.vista && (rol==="admin"||rol==="cocina") ? S.mensajes.filter(m=>m.para===rol && !m.leido) : [];
  const banner = nuevas.length && S.tab!=="notas" ? `<div class="alert no-print" role="status"><strong>${nuevas.length===1?"Tienes una nota nueva":"Tienes "+nuevas.length+" notas nuevas"} de ${rol==="admin"?"la administración":"los administradores"}.</strong>
      <p style="margin:6px 0">${esc(nuevas[nuevas.length-1].texto.slice(0,140))}${nuevas[nuevas.length-1].texto.length>140?"…":""}</p><button class="btn" data-a="tab" data-v="notas">Leer y marcar como leída</button></div>` : "";
  const avsAdm = rol==="residente" && !S.vista ? (S.avisos||[]).filter(a=>!S.vistos.includes("av|"+a.id)) : [];
  const avs = esComensal(u) ? avisosResidente().filter(x=>!x.visto) : [];
  const bannerAdm = avsAdm.map(a=>`<div class="alert no-print" role="status" style="border-left-color:var(--primary)"><strong>Aviso de los administradores</strong> <span class="muted small">${esc(hora(a.ts))}</span><p style="margin:6px 0">${esc(a.texto).replace(/\n/g,"<br>")}</p><button class="link" data-a="av-visto" data-v="av|${esc(a.id)}">Entendido</button></div>`).join("");
  const bannerAv = bannerAdm + (avs.length ? avs.map(x=>`<div class="alert no-print" role="status"><strong>Aviso para el ${esc(fmtLong(x.fecha).toLowerCase())}</strong><p style="margin:6px 0">${esc(x.texto).replace(/\n/g,"<br>")}</p><button class="link" data-a="av-visto" data-v="${esc(x.clave)}">Entendido</button></div>`).join("") : "");
  const cab = S.vista
    ? `<div class="status prov no-print" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span>Estás viendo lo que ve la administración. Solo lectura.</span><button class="btn" data-a="vista-salir">Volver a mi vista</button></div><div class="top"><div class="brand"><h1>Libro de comidas<span class="marca">Mizar</span></h1></div></div>`
    : cabecera(rol==="cocina" ? "Administración" : (uReal.nombre||""), rol==="admin") + panelPw();
  const actual = t.find(x=>x[0]===S.tab);
  return modalHTML() + cab + (actual ? `<h2 class="sec-t">${actual[1]}</h2>` : "") + (S.vista ? "" : avisoDatos(u)) + banner + bannerAv + main + (t.length>1 ? navegacion(t, rol, esComensal(u)) : "");
}

/* ---------- PDF del parte ---------- */
async function descargarPDF(f){
  if (!window.jspdf || !window.jspdf.jsPDF){
    await new Promise(res=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"; sc.onload=res; sc.onerror=res; document.head.appendChild(sc); });
    if (!window.jspdf || !window.jspdf.jsPDF){ toast("No se ha podido preparar el PDF. Comprueba la conexión."); return; }
  }
  const doc = new window.jspdf.jsPDF({unit:"mm", format:"a4"});
  const W=210, H=297, M=16, CW=W-2*M;
  const VERDE=[46,94,78], TINTA=[28,38,33], GRIS=[95,108,100], ROJO=[162,59,44], LINEA=[214,222,216], SUAVE=[232,240,235], OCRE=[246,236,214];
  const anon = true; // El PDF es para la administración: nunca lleva nombres
  const D = datosParte(f), filas = D.filas, lk = locked(f), manana = DIAS[wd(addDays(f,1))].toLowerCase();
  const ahora = new Date(), hh = d => String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const col = c => doc.setTextColor(c[0],c[1],c[2]);
  let y;

  doc.setFillColor(...VERDE); doc.rect(0,0,W,5,"F");
  y = 17; doc.setFont("helvetica","normal"); doc.setFontSize(10); col(GRIS); doc.text("Libro de comidas - Mizar", M, y);
  y += 10; doc.setFont("helvetica","bold"); doc.setFontSize(21); col(TINTA); doc.text("Parte del "+fmtLong(f).toLowerCase(), M, y);
  y += 7; doc.setFont("helvetica","normal"); doc.setFontSize(10);
  if (lk){ col(VERDE); doc.text("Definitivo. Cerrado a las "+horaCierre(f)+".", M, y); }
  else { col(ROJO); doc.text("Provisional, generado a las "+hh(ahora)+". Puede cambiar hasta las "+horaCierre(f)+".", M, y); }
  y += 5; doc.setDrawColor(...LINEA); doc.setLineWidth(0.4); doc.line(M,y,W-M,y); y += 7;

  const avisos = D.avisos;
  if (avisos.length){
    doc.setFontSize(10.5);
    const lines = avisos.flatMap(t => doc.splitTextToSize("- "+t, CW-10));
    const h = 10 + lines.length*5;
    doc.setFillColor(...OCRE); doc.roundedRect(M, y, CW, h, 2, 2, "F");
    doc.setFont("helvetica","bold"); col(TINTA); doc.text("Avisos para este parte", M+5, y+7);
    doc.setFont("helvetica","normal"); doc.text(lines, M+5, y+12.5);
    y += h + 7;
  }

  const cardW = (CW-6)/2;
  function card(x, y0, titulo, filasCard, extras){
    let yy = y0 + 8;
    const body = [];
    filasCard.forEach(([lab, list, extra, srv]) => {
      body.push({t:"row", lab, n:list.length+(extra||0)});
      if (extra) body.push({t:"ext", l:"Incluye "+extra+" comensal"+(extra>1?"es":"")+" extra"});
      const rt = regTxt(list, anon, srv);
      if (rt) doc.splitTextToSize(rt, cardW-10).forEach(l=>body.push({t:"reg", l}));
    });
    (extras||[]).forEach(l => doc.splitTextToSize(l, cardW-10).forEach(x=>body.push({t:"ext", l:x})));
    const h = 12 + body.reduce((a,b)=>a+(b.t==="row"?7:4.6),0);
    doc.setDrawColor(...LINEA); doc.setLineWidth(0.4); doc.roundedRect(x, y0, cardW, h, 2, 2, "S");
    doc.setFont("helvetica","bold"); doc.setFontSize(12); col(VERDE); doc.text(titulo, x+5, yy);
    yy += 7;
    body.forEach(b => {
      if (b.t==="row"){ doc.setFont("helvetica","normal"); doc.setFontSize(10.5); col(TINTA); doc.text(b.lab, x+5, yy);
        doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.text(String(b.n), x+cardW-5, yy, {align:"right"}); yy += 7; }
      else { doc.setFont("helvetica","normal"); doc.setFontSize(8.8); col(b.t==="reg"?ROJO:GRIS); doc.text(b.l, x+5, yy-2.2); yy += 4.6; }
    });
    return y0 + h + 5;
  }
  const exB = sumaBolsas(D.bolsasExtra);
  const totalComida = D.turnos.reduce((a,t)=>a+t[1].length+t[2],0) + D.bolsas.length + exB;
  let yL = card(M, y, "Comida ("+totalComida+")", [...D.turnos.map(t=>[t[0],t[1],t[2],"comida"]), ["En bolsa", D.bolsas, exB, "comida"]], bolsasPorHora(D.bolsas, D.bolsasExtra, anon).map(x=>"Bolsas a las "+x.h+": "+x.n+(x.det?" ("+x.det+")":"")));
  yL = card(M, yL, "Cena", [["Cenan hoy", D.cena[0], D.cena[1], "cena"]]);
  let yR = card(M+cardW+6, y, "Desayuno del "+manana, [["Desayunan", D.desayuno[0], D.desayuno[1], "desayuno"]]);
  yR = card(M+cardW+6, yR, "Para llevar el "+manana, [["Tupper", D.tupper, 0, "llevar"],["Bolsa de comida", D.bolsaM, 0, "llevar"]], anon ? [] : [...D.tupper,...D.bolsaM].map(o=>o.r.nombre+": "+(o.sel.llevar==="tupper"?"tupper":"bolsa de comida")));
  y = Math.max(yL, yR) + 4;

  if (!anon){
  const cols = [["Persona",60],["Comida",44],["Cena",22],["Desayuno",26],["Llevar",26]];
  function cabeceraTabla(){
    doc.setFillColor(...SUAVE); doc.rect(M, y, CW, 8, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); col(TINTA);
    let x = M+3; cols.forEach(([t,w])=>{ doc.text(t, x, y+5.4); x += w; }); y += 8;
  }
  if (y > H-40){ doc.addPage(); y = M; }
  doc.setFont("helvetica","bold"); doc.setFontSize(13); col(TINTA); doc.text("Detalle por persona", M, y); doc.setFont("helvetica","normal"); doc.setFontSize(8.5); col(GRIS); doc.text("Desayuno y llevar: del "+manana, W-M, y, {align:"right"}); y += 4;
  cabeceraTabla();
  filas.forEach((o,i) => {
    const rh = o.r.regimen ? 10.5 : 7.5;
    if (y + rh > H-16){ doc.addPage(); y = M; cabeceraTabla(); }
    if (i%2) { doc.setFillColor(248,250,248); doc.rect(M, y, CW, rh, "F"); }
    const vals = [null, o.sel.comida==="no"?"-":comidaTxt(o.sel), o.sel.cena?"Sí":"-", o.sel.desayuno?"Sí":"-", o.sel.llevar==="nada"?"-":(o.sel.llevar==="tupper"?"Tupper":"Bolsa")];
    let x = M+3;
    doc.setFont("helvetica","normal"); doc.setFontSize(9.8); col(TINTA);
    doc.text(doc.splitTextToSize(o.r.nombre, cols[0][1]-4)[0], x, y+5);
    if (o.r.regimen){ doc.setFontSize(8); col(ROJO); doc.text(doc.splitTextToSize(o.r.regimen, cols[0][1]-4)[0], x, y+8.8); doc.setFontSize(9.8); col(TINTA); }
    x += cols[0][1];
    for (let k=1;k<cols.length;k++){ doc.text(vals[k], x, y+5); x += cols[k][1]; }
    y += rh; doc.setDrawColor(...LINEA); doc.setLineWidth(0.2); doc.line(M, y, W-M, y);
  });
  if (!filas.length){ doc.setFont("helvetica","normal"); col(GRIS); doc.text("No hay comensales este día.", M+3, y+6); }

  }
  const n = doc.getNumberOfPages();
  for (let i=1;i<=n;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); col(GRIS);
    doc.text("Generado el "+ahora.getDate()+"/"+(ahora.getMonth()+1)+"/"+ahora.getFullYear()+" a las "+hh(ahora), M, H-8);
    doc.text("Página "+i+" de "+n, W-M, H-8, {align:"right"}); }

  const filename = "parte-"+f+".pdf", blob = doc.output("blob");
  const movil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints>1 && /Macintosh/.test(navigator.userAgent));
  try {
    const file = new File([blob], filename, {type:"application/pdf"});
    if (movil && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Parte del "+fmtLong(f).toLowerCase()}); return; }
  } catch(e){ if (e && e.name==="AbortError") return; }
  if (movil){ const url = URL.createObjectURL(blob), win = window.open(url, "_blank"); if (win) { setTimeout(()=>URL.revokeObjectURL(url), 60000); return; } }
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(e){}
  if (dl){
    try { await dl.save({filename, data: blob}); } catch(e){ if (!e || e.code!=="declined") toast("No se ha podido descargar el PDF."); }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/* ---------- Acciones ---------- */
async function guardarSel(ctx, sel){
  const rid = S.session.uid;
  if (ctx.startsWith("d:")){
    const f = ctx.slice(2);
    if (locked(f)){ toast("Ya no se puede cambiar: está cerrado."); return; }
    const id = f+"_"+rid, base = norm((S.plantillas[rid]||{})["d"+wd(f)]), K = ["comida","horaBolsa","cena","desayuno","llevar"];
    if (K.every(k=>String(sel[k])===String(base[k]))){ delete S.pedidos[id]; render(); await w(()=>S.db.doc("pedidos/"+id).delete()); return; }
    const doc = {fecha:f, residente:rid, ...sel, ts:Date.now()};
    S.pedidos[id] = doc; render();
    await w(()=>S.db.doc("pedidos/"+id).set(doc));
  } else {
    const k = "d"+ctx.slice(2), t = {...(S.plantillas[rid]||{}), [k]:sel};
    S.plantillas[rid] = t; render();
    await w(()=>S.db.doc("plantillas/"+rid).set(t));
  }
}
function selDe(ctx){
  const rid = S.session.uid;
  if (ctx.startsWith("d:")) return efectiva(rid, ctx.slice(2)).sel;
  const t = S.plantillas[rid] && S.plantillas[rid]["d"+ctx.slice(2)];
  return norm(t);
}
function marcarLeidos(role){
  S.mensajes.filter(m=>m.para===role && !m.leido).forEach(m=>{ m.leido=true; w(()=>S.db.doc("mensajes/"+m.id).update({leido:true})); });
}
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.draft;
  if (k==="rf_regimen" && (!String(S.drafts[k]||"").trim()) !== (!e.target.value.trim())){ S.drafts[k] = e.target.value; render(); return; }
  if (k){ S.drafts[k] = e.target.value; if (k==="msg"){ const b=document.querySelector('[data-a="sendmsg"]'); if (b) b.disabled = !e.target.value.trim(); } }
});
document.addEventListener("change", e => {
  if (e.target.tagName==="SELECT" && e.target.dataset.draft){ S.drafts[e.target.dataset.draft] = e.target.value; return; }
  const ctx = e.target.dataset && e.target.dataset.hora;
  if (ctx) guardarSel(ctx, {...selDe(ctx), horaBolsa:e.target.value});
});
document.addEventListener("keydown", e => {
  if (S.tab==="wordle" && S.session && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !e.ctrlKey && !e.metaKey && !e.altKey){
    const k = e.key==="Enter" ? "enter" : e.key==="Backspace" ? "back" : e.key.toLowerCase();
    if (k==="enter" || k==="back" || /^[a-zñ]$/.test(k)){ e.preventDefault(); wlTecla(k); return; }
  }
  if (e.key==="Enter" && e.target.id==="pin"){ e.preventDefault(); act("login", e.target); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b || b.disabled) return;
  if (b.getAttribute("aria-disabled")==="true"){ toast("Esto ya está cerrado: no se puede cambiar. Si lo necesitas, llama a un administrador."); return; }
  act(b.dataset.a, b);
});

async function act(a, b){
  const v = b.dataset.v;
  if (S.vista && !["tab","menu","parteday","cal-mes","cal-dia","modal-cerrar","pdf","print","vista-salir","logout","reload","cuenta"].includes(a)){ toast("Vista de la administración: solo lectura."); return; }
  switch(a){
    case "setup": {
      const nombre=String(draft("su_nombre","Nacho")).trim(), usuario=normU(draft("su_usuario","nacho")), pw=String(draft("su_pin")), h=draft("su_hora","09:30");
      if (!nombre || !/^[a-z0-9._-]{2,30}$/.test(usuario)){ toast("Revisa el nombre y el usuario (solo letras, números, punto o guion)."); return; }
      if (pw.length<6){ toast("La contraseña debe tener al menos 6 caracteres."); return; }
      S.entrando=true; S.enAlta=true; render();
      try {
        const email = emailNuevo(usuario), cred = await createUserWithEmailAndPassword(auth, email, pw), pid = newId("u"), b = writeBatch(fs);
        b.set(fdoc(fs,"cuentas/"+cred.user.uid), {perfil:pid});
        b.set(fdoc(fs,"usuarios/"+pid), {rol:"admin", comensal:false, iniciales:inicialesDe(nombre), activo:true});
        b.set(fdoc(fs,"nombres/"+pid), {nombre, usuario});
        b.set(fdoc(fs,"privados/"+pid), {regimen:"", authUid:cred.user.uid});
        b.set(fdoc(fs,"logins/"+usuario), {email, perfil:pid});
        b.set(fdoc(fs,"config/general"), {horaCierre:h, horaCierreFinde:"10:30", principal:pid});
        await b.commit();
        S.enAlta=false; S.drafts={}; await entrarCon(auth.currentUser);
      } catch(e){ console.error(e); S.enAlta=false; S.loginErr = "No se ha podido completar ("+(e.code||e.message)+")."; }
      S.entrando=false; break;
    }
    case "role": S.loginRole = v||null; S.loginRes=null; S.loginErr=""; S.drafts.pin=""; break;
    case "pickres": S.loginRes = b.dataset.id; S.loginErr=""; break;
    case "login": {
      const un=normU(draft("lg_user")), pw=String(draft("pin")||"");
      if (!un || !pw){ S.loginErr="Escribe tu usuario y tu contraseña."; break; }
      S.entrando=true; S.loginErr=""; render();
      try {
        const l = await S.db.doc("logins/"+un).get();
        if (!l.exists) throw {code:"auth/invalid-credential"};
        await signInWithEmailAndPassword(auth, l.data().email, pw);
        S.drafts={};
      } catch(e){
        S.loginErr = ["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-email","auth/invalid-login-credentials"].includes(e.code) ? "Usuario o contraseña incorrectos."
          : e.code==="auth/too-many-requests" ? "Demasiados intentos seguidos. Espera unos minutos." : "No se ha podido entrar. Comprueba la conexión ("+(e.code||e.message)+").";
      }
      S.entrando=false; break;
    }
    case "logout": S.cuenta = false; S.drafts={}; S.openDay=null; S.openWd=null; await signOut(auth); return;
    case "vista-admon": S.cuenta = false; S.vista = true; S.tabReal = S.tab; S.tab = "parte"; S.verPw = false; S.menu = false; window.scrollTo(0,0); break;
    case "vista-salir": S.vista = false; S.tab = S.tabReal || null; S.menu = false; window.scrollTo(0,0); break;
    case "menu": S.menu = !S.menu; S.cuenta = false; break;
    case "cal-dia": S.modal = {tipo:"cal", f:b.dataset.f}; break;
    case "modal-cerrar": S.modal = null; delete S.drafts.ed; delete S.drafts.ed_hora; delete S.drafts.ed_aviso; break;
    case "ed-abrir": {
      if (rolDe(resById(S.session.uid))!=="admin") return;
      const rid = b.dataset.id, f = b.dataset.f;
      S.drafts.ed = {...efectiva(rid, f).sel}; S.drafts.ed_hora = S.drafts.ed.horaBolsa || "14:00"; S.drafts.ed_aviso = true;
      S.modal = {tipo:"edit", rid, f}; break;
    }
    case "ed-set": {
      const k = b.dataset.k, val = (k==="cena"||k==="desayuno") ? v==="true" : v, e = {...S.drafts.ed, [k]:val};
      if (k==="llevar" && val!=="nada") { /* quien se lleva algo al día siguiente sigue pudiendo comer hoy: no se toca */ }
      if (k==="comida" && val!=="bolsa") e.horaBolsa = "";
      S.drafts.ed = e; break;
    }
    case "ed-aviso": S.drafts.ed_aviso = b.checked; break;
    case "ed-guardar": {
      const m = S.modal; if (!m || m.tipo!=="edit") return;
      const r = resById(m.rid), antes = efectiva(m.rid, m.f).sel, e = {...S.drafts.ed};
      if (e.comida==="bolsa") e.horaBolsa = String(draft("ed_hora","14:00")) || "14:00";
      const doc = {fecha:m.f, residente:m.rid, comida:e.comida, horaBolsa:e.horaBolsa||"", cena:!!e.cena, desayuno:!!e.desayuno, llevar:e.llevar||"nada", ts:Date.now(), editadoPor:S.session.uid};
      await w(()=>S.db.doc("pedidos/"+m.f+"_"+m.rid).set(doc));
      if (locked(m.f) && S.drafts.ed_aviso!==false){
        const manana = DIAS[wd(addDays(m.f,1))].toLowerCase();

        b.set(fdoc(fs,"logins/"+u), {email, perfil:r.id});
        b.update(fdoc(fs,"privados/"+r.id), {authUid:cred.user.uid});
        if (r.authUid) b.delete(fdoc(fs,"cuentas/"+r.authUid));
        await b.commit();
        delete S.drafts.rf_newpw; toast("Contraseña restablecida. Nueva contraseña: "+pw);
      } catch(e){ console.error(e); toast("No se ha podido restablecer ("+(e.code||e.message)+")."); }
      S.entrando=false; break;
    }
    case "res-toggle": { const r=resById(b.dataset.id); if (r.id===S.session.uid || esTitular(r)) return;
      if (rolDe(r)==="admin" && !puedeGestionarAdmins(resById(S.session.uid))) return; await w(()=>S.db.doc("usuarios/"+r.id).update({activo: r.activo===false})); return; }
    case "dl-uid": S.drafts.dl_uid = v; break;
    case "tr-uid": S.drafts.tr_uid = v; S.drafts.tr_confirm = false; break;
    case "tr-ask": S.drafts.tr_confirm = true; break;
    case "tr-cancel": S.drafts.tr_confirm = false; break;
    case "tr-do": {
      const me=resById(S.session.uid), nuevo=resById(draft("tr_uid",""));
      if (!esTitular(me) || !nuevo || rolDe(nuevo)!=="admin") return;
      const c2 = {...S.config, principal:nuevo.id}; delete c2.delegacion;
      await w(()=>S.db.doc("config/general").set(c2));
      S.drafts.tr_uid=""; S.drafts.tr_confirm=false; toast(nuevo.nombre+" es ahora el administrador principal."); break;
    }
    case "dl-save": {
      if (!esTitular(resById(S.session.uid))) return;
      const uid=draft("dl_uid",""), desde=draft("dl_desde",today()), hasta=draft("dl_hasta",addDays(today(),6));
      if (!uid){ toast("Elige en quién delegas."); return; }
      if (!desde || !hasta || hasta<desde || hasta<today()){ toast("Revisa las fechas: el final no puede ser anterior al inicio ni a hoy."); return; }
      const desdeMs = parse(desde).getTime(), hastaMs = parse(addDays(hasta,1)).getTime()-1;
      await w(()=>S.db.doc("config/general").update({delegacion:{uid, desde, hasta, desdeMs, hastaMs}}));
      toast("Delegación guardada."); break;
    }
    case "dl-clear": {
      if (!esTitular(resById(S.session.uid))) return;
      const c3 = {...S.config}; delete c3.delegacion;
      await w(()=>S.db.doc("config/general").set(c3));
      toast("Delegación anulada."); break;
    }
    case "cfg-save": {
      const horasDia = {};
      for (let k=0;k<7;k++){ const h = String(draft("cf_h"+k, horaSemana(k))); if (!/^\d{2}:\d{2}$/.test(h)){ toast("Revisa la hora del "+DIAS[k].toLowerCase()+"."); return; } horasDia[k] = h; }
      const todas = [...Object.values(horasDia)].sort(), horaMaxSemana = todas[todas.length-1];
      await w(()=>S.db.doc("config/general").update({horasDia, horaMaxSemana, horaCierre: horasDia[0], horaCierreFinde: horasDia[5]}));
      for (let k=0;k<7;k++) delete S.drafts["cf_h"+k];
      toast("Horas guardadas."); break;
    }
    case "exc-add": {
      const f = String(draft("exc_f", today())), h = String(draft("exc_h","11:00"));
      if (!/^\d{4}-\d{2}-\d{2}$/.test(f) || f<today()){ toast("Elige un día de hoy en adelante."); return; }
      if (!/^\d{2}:\d{2}$/.test(h)){ toast("Indica la hora."); return; }
      const ex = Object.fromEntries(Object.entries((S.config||{}).excepciones||{}).filter(([d])=>d>=today()));
      ex[f] = h;
      await w(()=>S.db.doc("config/general").update({excepciones: ex}));
      toast("Día especial guardado: el "+fmtLong(f).toLowerCase()+" se podrá apuntar hasta las "+h+"."); break;
    }
    case "exc-del": {
      const ex = Object.fromEntries(Object.entries((S.config||{}).excepciones||{}).filter(([d])=>d>=today() && d!==v));
      await w(()=>S.db.doc("config/general").update({excepciones: ex}));
      toast("Día especial quitado."); break;
    }
  }
  render();
}
render();
</script>
</body>
</html>
