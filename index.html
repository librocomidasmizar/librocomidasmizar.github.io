/* ---------- PDF del parte ---------- */
async function descargarPDF(f){
  if (!window.jspdf || !window.jspdf.jsPDF){
    await new Promise(res=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"; sc.onload=res; sc.onerror=res; document.head.appendChild(sc); });
    if (!window.jspdf || !window.jspdf.jsPDF){ toast("No se ha podido preparar el PDF. Comprueba la conexión."); return; }
  }
  const doc = new window.jspdf.jsPDF({unit:"mm", format:"a4"});
  const W=210, H=297, M=16, CW=W-2*M;
  const VERDE=[46,94,78], TINTA=[28,38,33], GRIS=[95,108,100], ROJO=[162,59,44], LINEA=[214,222,216], SUAVE=[232,240,235], OCRE=[246,236,214];
  const anon = true; // El PDF es para la administración: nunca lleva nombres
  const D = datosParte(f), filas = D.filas, lk = locked(f), manana = DIAS[wd(addDays(f,1))].toLowerCase();
  const ahora = new Date(), hh = d => String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const col = c => doc.setTextColor(c[0],c[1],c[2]);
  let y;

  doc.setFillColor(...VERDE); doc.rect(0,0,W,5,"F");
  y = 17; doc.setFont("helvetica","normal"); doc.setFontSize(10); col(GRIS); doc.text("Libro de comidas - Mizar", M, y);
  y += 10; doc.setFont("helvetica","bold"); doc.setFontSize(21); col(TINTA); doc.text("Parte del "+fmtLong(f).toLowerCase(), M, y);
  y += 7; doc.setFont("helvetica","normal"); doc.setFontSize(10);
  if (lk){ col(VERDE); doc.text("Definitivo. Cerrado a las "+horaCierre(f)+".", M, y); }
  else { col(ROJO); doc.text("Provisional, generado a las "+hh(ahora)+". Puede cambiar hasta las "+horaCierre(f)+".", M, y); }
  y += 5; doc.setDrawColor(...LINEA); doc.setLineWidth(0.4); doc.line(M,y,W-M,y); y += 7;

  const avisos = D.avisos;
  if (avisos.length){
    doc.setFontSize(10.5);
    const lines = avisos.flatMap(t => doc.splitTextToSize("- "+t, CW-10));
    const h = 10 + lines.length*5;
    doc.setFillColor(...OCRE); doc.roundedRect(M, y, CW, h, 2, 2, "F");
    doc.setFont("helvetica","bold"); col(TINTA); doc.text("Avisos para este parte", M+5, y+7);
    doc.setFont("helvetica","normal"); doc.text(lines, M+5, y+12.5);
    y += h + 7;
  }

  const cardW = (CW-6)/2;
  function card(x, y0, titulo, filasCard, extras){
    let yy = y0 + 8;
    const body = [];
    filasCard.forEach(([lab, list, extra, srv, ads]) => {
      body.push({t:"row", lab, n:list.length+(extra||0)});
      const it = incluyeTxt(extra, ads||0); if (it) body.push({t:"ext", l:it});
      const rt = regTxt(list, anon, srv);
      if (rt) doc.splitTextToSize(rt, cardW-10).forEach(l=>body.push({t:"reg", l}));
    });
    (extras||[]).forEach(l => doc.splitTextToSize(l, cardW-10).forEach(x=>body.push({t:"ext", l:x})));
    const h = 12 + body.reduce((a,b)=>a+(b.t==="row"?7:4.6),0);
    doc.setDrawColor(...LINEA); doc.setLineWidth(0.4); doc.roundedRect(x, y0, cardW, h, 2, 2, "S");
    doc.setFont("helvetica","bold"); doc.setFontSize(12); col(VERDE); doc.text(titulo, x+5, yy);
    yy += 7;
    body.forEach(b => {
      if (b.t==="row"){ doc.setFont("helvetica","normal"); doc.setFontSize(10.5); col(TINTA); doc.text(b.lab, x+5, yy);
        doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.text(String(b.n), x+cardW-5, yy, {align:"right"}); yy += 7; }
      else { doc.setFont("helvetica","normal"); doc.setFontSize(8.8); col(b.t==="reg"?ROJO:GRIS); doc.text(b.l, x+5, yy-2.2); yy += 4.6; }
    });
    return y0 + h + 5;
  }
  const exB = sumaBolsas(D.bolsasExtra);
  const totalComida = D.turnos.reduce((a,t)=>a+t[1].length+t[2],0) + D.bolsas.length + exB;
  let yL = card(M, y, "Comida ("+totalComida+")", [...D.turnos.map(t=>[t[0],t[1],t[2],"comida",t[3]]), ["En bolsa", D.bolsas, exB, "comida"]], bolsasPorHora(D.bolsas, D.bolsasExtra, anon).map(x=>"Bolsas a las "+x.h+": "+x.n+(x.det?" ("+x.det+")":"")));
  yL = card(M, yL, "Cena", [["Cenan hoy", D.cena[0], D.cena[1], "cena"]]);
  let yR = card(M+cardW+6, y, "Desayuno del "+manana, [["Desayunan", D.desayuno[0], D.desayuno[1], "desayuno"]]);
  yR = card(M+cardW+6, yR, "Para llevar el "+manana, [["Tupper", D.tupper, 0, "llevar"],["Bolsa de comida", D.bolsaM, 0, "llevar"]], anon ? [] : [...D.tupper,...D.bolsaM].map(o=>o.r.nombre+": "+(o.sel.llevar==="tupper"?"tupper":"bolsa de comida")));
  y = Math.max(yL, yR) + 4;

  if (!anon){
  const cols = [["Persona",60],["Comida",44],["Cena",22],["Desayuno",26],["Llevar",26]];
  function cabeceraTabla(){
    doc.setFillColor(...SUAVE); doc.rect(M, y, CW, 8, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); col(TINTA);
    let x = M+3; cols.forEach(([t,w])=>{ doc.text(t, x, y+5.4); x += w; }); y += 8;
  }
  if (y > H-40){ doc.addPage(); y = M; }
  doc.setFont("helvetica","bold"); doc.setFontSize(13); col(TINTA); doc.text("Detalle por persona", M, y); doc.setFont("helvetica","normal"); doc.setFontSize(8.5); col(GRIS); doc.text("Desayuno y llevar: del "+manana, W-M, y, {align:"right"}); y += 4;
  cabeceraTabla();
  filas.forEach((o,i) => {
    const rh = o.r.regimen ? 10.5 : 7.5;
    if (y + rh > H-16){ doc.addPage(); y = M; cabeceraTabla(); }
    if (i%2) { doc.setFillColor(248,250,248); doc.rect(M, y, CW, rh, "F"); }
    const vals = [null, o.sel.comida==="no"?"-":comidaTxt(o.sel), o.sel.cena?"Sí":"-", o.sel.desayuno?"Sí":"-", o.sel.llevar==="nada"?"-":(o.sel.llevar==="tupper"?"Tupper":"Bolsa")];
    let x = M+3;
    doc.setFont("helvetica","normal"); doc.setFontSize(9.8); col(TINTA);
    doc.text(doc.splitTextToSize(o.r.nombre, cols[0][1]-4)[0], x, y+5);
    if (o.r.regimen){ doc.setFontSize(8); col(ROJO); doc.text(doc.splitTextToSize(o.r.regimen, cols[0][1]-4)[0], x, y+8.8); doc.setFontSize(9.8); col(TINTA); }
    x += cols[0][1];
    for (let k=1;k<cols.length;k++){ doc.text(vals[k], x, y+5); x += cols[k][1]; }
    y += rh; doc.setDrawColor(...LINEA); doc.setLineWidth(0.2); doc.line(M, y, W-M, y);
  });
  if (!filas.length){ doc.setFont("helvetica","normal"); col(GRIS); doc.text("No hay comensales este día.", M+3, y+6); }

  }
  const n = doc.getNumberOfPages();
  for (let i=1;i<=n;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); col(GRIS);
    doc.text("Generado el "+ahora.getDate()+"/"+(ahora.getMonth()+1)+"/"+ahora.getFullYear()+" a las "+hh(ahora), M, H-8);
    doc.text("Página "+i+" de "+n, W-M, H-8, {align:"right"}); }

  const filename = "parte-"+f+".pdf", blob = doc.output("blob");
  const movil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints>1 && /Macintosh/.test(navigator.userAgent));
  try {
    const file = new File([blob], filename, {type:"application/pdf"});
    if (movil && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Parte del "+fmtLong(f).toLowerCase()}); return; }
  } catch(e){ if (e && e.name==="AbortError") return; }
  if (movil){ const url = URL.createObjectURL(blob), win = window.open(url, "_blank"); if (win) { setTimeout(()=>URL.revokeObjectURL(url), 60000); return; } }
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(e){}
  if (dl){
    try { await dl.save({filename, data: blob}); } catch(e){ if (!e || e.code!=="declined") toast("No se ha podido descargar el PDF."); }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/* ---------- Acciones ---------- */
async function guardarSel(ctx, sel){
  const rid = S.session.uid;
  if (ctx.startsWith("d:")){
    const f = ctx.slice(2);
    if (locked(f)){ toast("Ya no se puede cambiar: está cerrado."); return; }
    const id = f+"_"+rid, base = norm((S.plantillas[rid]||{})["d"+wd(f)]), K = ["comida","horaBolsa","cena","desayuno","llevar"];
    if (K.every(k=>String(sel[k])===String(base[k]))){ delete S.pedidos[id]; render(); await w(()=>S.db.doc("pedidos/"+id).delete()); return; }
    const doc = {fecha:f, residente:rid, ...sel, ts:Date.now()};
    S.pedidos[id] = doc; render();
    await w(()=>S.db.doc("pedidos/"+id).set(doc));
  } else {
    const k = "d"+ctx.slice(2), t = {...(S.plantillas[rid]||{}), [k]:sel};
    S.plantillas[rid] = t; render();
    await w(()=>S.db.doc("plantillas/"+rid).set(t));
  }
}
function selDe(ctx){
  const rid = S.session.uid;
  if (ctx.startsWith("d:")) return efectiva(rid, ctx.slice(2)).sel;
  const t = S.plantillas[rid] && S.plantillas[rid]["d"+ctx.slice(2)];
  return norm(t);
}
function marcarLeidos(role, fn){
  S.mensajes.filter(m=>m.para===role && !m.leido && (fn ? fn(m) : true)).forEach(m=>{ m.leido=true; w(()=>S.db.doc("mensajes/"+m.id).update({leido:true})); });
}

async function act(a, b){
  const v = b.dataset.v;
  if (S.vista && !["tab","menu","parteday","cal-mes","cal-dia","modal-cerrar","pdf","print","vista-salir","logout","reload","cuenta","mes","mes-pdf","mes-csv","mes-mail","plegar","nota-sel","ir-nota","g-val"].includes(a)){ toast("Vista de la administración: solo lectura."); return; }
  switch(a){
    case "setup": {
      const nombre=String(draft("su_nombre","Nacho")).trim(), usuario=normU(draft("su_usuario","nacho")), pw=String(draft("su_pin")), h=draft("su_hora","09:30");
      if (!nombre || !/^[a-z0-9._-]{2,30}$/.test(usuario)){ toast("Revisa el nombre y el usuario (solo letras, números, punto o guion)."); return; }
      if (pw.length<6){ toast("La contraseña debe tener al menos 6 caracteres."); return; }
      S.entrando=true; S.enAlta=true; render();
      try {
        const email = emailNuevo(usuario), cred = await createUserWithEmailAndPassword(auth, email, pw), pid = newId("u"), b = writeBatch(fs);
        b.set(fdoc(fs,"cuentas/"+cred.user.uid), {perfil:pid});
        b.set(fdoc(fs,"usuarios/"+pid), {rol:"admin", comensal:false, iniciales:inicialesDe(nombre), activo:true});
        b.set(fdoc(fs,"nombres/"+pid), {nombre, usuario});
        b.set(fdoc(fs,"privados/"+pid), {regimen:"", authUid:cred.user.uid});
        b.set(fdoc(fs,"logins/"+usuario), {email, perfil:pid});
        b.set(fdoc(fs,"config/general"), {horaCierre:h, horaCierreFinde:"10:30", principal:pid});
        await b.commit();
        S.enAlta=false; S.drafts={}; await entrarCon(auth.currentUser);
      } catch(e){ console.error(e); S.enAlta=false; S.loginErr = "No se ha podido completar ("+(e.code||e.message)+")."; }
      S.entrando=false; break;
    }
    case "role": S.loginRole = v||null; S.loginRes=null; S.loginErr=""; S.drafts.pin=""; break;
    case "pickres": S.loginRes = b.dataset.id; S.loginErr=""; break;
    case "login": {
      const un=normU(draft("lg_user")), pw=String(draft("pin")||"");
      if (!un || !pw){ S.loginErr="Escribe tu usuario y tu contraseña."; break; }
      S.entrando=true; S.loginErr=""; render();
      try {
        const l = await S.db.doc("logins/"+un).get();
        if (!l.exists) throw {code:"auth/invalid-credential"};
        await signInWithEmailAndPassword(auth, l.data().email, pw);
        S.drafts={};
      } catch(e){
        S.loginErr = ["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-email","auth/invalid-login-credentials"].includes(e.code) ? "Usuario o contraseña incorrectos."
          : e.code==="auth/too-many-requests" ? "Demasiados intentos seguidos. Espera unos minutos." : "No se ha podido entrar. Comprueba la conexión ("+(e.code||e.message)+").";
      }
      S.entrando=false; break;
    }
    case "logout": if (tokenGuardado()){ try { await S.db.doc("tokens/"+tokenGuardado()).delete(); } catch(e){} } S.cuenta = false; S.drafts={}; S.openDay=null; S.openWd=null; await signOut(auth); return;
    case "vista-admon": S.cuenta = false; S.vista = true; S.tabReal = S.tab; S.tab = "parte"; S.verPw = false; S.menu = false; window.scrollTo(0,0); break;
    case "vista-salir": S.vista = false; S.tab = S.tabReal || null; S.menu = false; window.scrollTo(0,0); break;
    case "menu": S.menu = !S.menu; S.cuenta = false; break;
    case "guia": { const me = resById(S.session.uid); S.cuenta = false; S.guiaAb = 0; S.modal = {tipo:"guia", rol: S.vista ? "cocina" : rolDe(me)}; break; }
    case "guia-ab": S.guiaAb = S.guiaAb===Number(v) ? -1 : Number(v); break;
    case "wl-ver": if (rolDe(resById(S.session.uid))!=="admin") return; delete S.drafts.wlDel; S.modal = {tipo:"wl", uid:b.dataset.id, sem: S.wlSem || lunesDe(today())}; break;
    case "wl-del-ask": S.drafts.wlDel = b.dataset.id; break;
    case "wl-del-no": delete S.drafts.wlDel; break;
    case "wl-del": { const id = b.dataset.id; delete S.drafts.wlDel; await w(()=>S.db.doc("wordle/"+id).delete()); delete S.wordle[id]; toast("Partida borrada: ya no cuenta en el ranking."); break; }
    case "cal-dia": S.modal = {tipo:"cal", f:b.dataset.f}; break;
    case "modal-cerrar": if (S.evEditId){ ["ev_tit","ev_det","ev_hora","ev_fin","ev_rep","ev_tipo","ev_fecha"].forEach(k=>delete S.drafts[k]); S.evEditId = null; } S.modal = null; delete S.drafts.ed; delete S.drafts.ed_hora; delete S.drafts.ed_aviso; break;
    case "ed-abrir": {
      if (rolDe(resById(S.session.uid))!=="admin") return;
      const rid = b.dataset.id, f = b.dataset.f;
      S.drafts.ed = {...efectiva(rid, f).sel}; S.drafts.ed_hora = S.drafts.ed.horaBolsa || "14:00"; S.drafts.ed_aviso = true;
      S.modal = {tipo:"edit", rid, f}; break;
    }
    case "ed-set": {
      const k = b.dataset.k, val = (k==="cena"||k==="desayuno") ? v==="true" : v, e = {...S.drafts.ed, [k]:val};
      if (k==="llevar" && val!=="nada") { /* quien se lleva algo al día siguiente sigue pudiendo comer hoy: no se toca */ }
      if (k==="comida" && val!=="bolsa") e.horaBolsa = "";
      S.drafts.ed = e; break;
    }
    case "ed-aviso": S.drafts.ed_aviso = b.checked; break;
    case "ed-guardar": {
      const m = S.modal; if (!m || m.tipo!=="edit") return;
      const r = resById(m.rid), antes = efectiva(m.rid, m.f).sel, e = {...S.drafts.ed};
      if (e.comida==="bolsa") e.horaBolsa = String(draft("ed_hora","14:00")) || "14:00";
      const doc = {fecha:m.f, residente:m.rid, comida:e.comida, horaBolsa:e.horaBolsa||"", cena:!!e.cena, desayuno:!!e.desayuno, llevar:e.llevar||"nada", ts:Date.now(), editadoPor:S.session.uid};
      await w(()=>S.db.doc("pedidos/"+m.f+"_"+m.rid).set(doc));
      if (locked(m.f) && S.drafts.ed_aviso!==false){
        const manana = DIAS[wd(addDays(m.f,1))].toLowerCase();
        const t = (x)=>[x.comida==="no"?"no come":"comida "+comidaTxt(x).toLowerCase(), x.cena?"cena":"no cena", x.desayuno?"desayuna el "+manana:"no desayuna el "+manana, x.llevar==="nada"?"":(x.llevar==="tupper"?"tupper":"bolsa de comida")+" para el "+manana].filter(Boolean).join(", ");
        const texto = "Cambio en el parte de "+iniciales(r||{})+": antes "+t(antes)+". Ahora "+t(doc)+".";
        await w(()=>S.db.collection("mensajes").doc(newId("m")).set({de:"admin", para:"cocina", texto, ts:Date.now(), leido:false, fecha:m.f}));
      }
      S.forzar.add(m.f); programarSync();
      S.modal = null; delete S.drafts.ed; delete S.drafts.ed_hora; delete S.drafts.ed_aviso;
      toast("Corrección guardada."); break;

    case "ev-add": {
      const f = draft("ev_fecha", today()), t = String(draft("ev_tit")).trim().slice(0,80), d = String(draft("ev_det")).trim().slice(0,500);
      const tipo = draft("ev_tipo","uno"), hora = tipo==="uno" ? String(draft("ev_hora","")) : "", fin = tipo==="varios" ? String(draft("ev_fin", addDays(f,2))) : f;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(f)){ toast("Elige el día."); return; }
      if (tipo==="varios" && (!/^\d{4}-\d{2}-\d{2}$/.test(fin) || fin<=f)){ toast("El día de fin tiene que ser posterior al de inicio."); return; }
      if (tipo==="varios" && fin>addDays(f,92)){ toast("Un evento puede durar como mucho tres meses."); return; }
      if (hora && !/^\d{2}:\d{2}$/.test(hora)){ toast("Revisa la hora."); return; }
      if (!t){ toast("Escribe qué se celebra."); return; }
      const rolA = rolDe(resById(S.session.uid)), directo = rolA==="admin" || rolA==="cocina";
      const repite = draft("ev_rep","no");
      if (S.evEditId){
        await w(()=>S.db.doc("eventos/"+S.evEditId).update({fecha:f, fin, hora, repite, titulo:t, detalle:d}));
        ["ev_tit","ev_det","ev_hora","ev_fin","ev_rep","ev_tipo","ev_fecha"].forEach(k=>delete S.drafts[k]);
        S.evEditId = null; S.modal = null; S.calMes = f.slice(0,7); toast("Evento actualizado."); break;
      }
      await w(()=>S.db.doc("eventos/"+newId("e")).set({fecha:f, fin, hora, repite, titulo:t, detalle:d, ts:Date.now(), autor:S.session.uid, estado: directo ? "aprobado" : "pendiente"}));
      delete S.drafts.ev_tit; delete S.drafts.ev_det; delete S.drafts.ev_hora; delete S.drafts.ev_fin; delete S.drafts.ev_rep; S.calMes = f.slice(0,7); toast(directo ? "Evento añadido." : "Propuesta enviada. Un administrador la revisará."); break;
    }
    case "ev-tipo": S.drafts.ev_tipo = v; break;
    case "ev-rep": S.drafts.ev_rep = v; break;
    case "qc-filtro": S.qcFiltro = v==="todos" ? null : v; break;
    case "qc-orden": S.qcOrden = (S.qcOrden && S.qcOrden.col===v) ? {col:v, dir:-S.qcOrden.dir} : {col:v, dir:1}; break;
    case "ads-mas": {
      const f = b.dataset.f, k = b.dataset.k;
      if (locked(f)){ toast("Ese martes ya está cerrado."); return; }
      const a0 = S.adscritos[f]||{}, p = adsProp(a0); p[k] = Math.max(0, p[k] + Number(v));
      const igual = p.normal===(a0.normal||0) && p.segundo===(a0.segundo||0);
      const a = {...a0, fecha:f, normal:a0.normal||0, segundo:a0.segundo||0, propNormal:p.normal, propSegundo:p.segundo, estado: igual ? ((a0.normal||a0.segundo) ? "aprobado" : "") : "pendiente", autor:S.session.uid, ts:Date.now()};
      S.adscritos[f] = a; render(); await w(()=>S.db.doc("adscritos/"+f).set(a)); return;
    }
    case "ads-ok": case "ads-no": {
      const f = b.dataset.f, a0 = S.adscritos[f]; if (!a0) return;
      const p = adsProp(a0);
      const nuevo = a==="ads-ok" ? {...a0, normal:p.normal, segundo:p.segundo, estado:"aprobado", revisadoPor:S.session.uid} : {...a0, estado:"rechazado", revisadoPor:S.session.uid};
      await w(()=>S.db.doc("adscritos/"+f).set(nuevo)); S.forzar.add(f);
      toast(nuevo.estado==="aprobado" ? (locked(f) ? "Aprobado. El parte ya estaba cerrado: avisa a la administración con una nota." : "Aprobado: ya se suma al parte.") : "Propuesta rechazada."); break;
    }
    case "ev-del": { const e = S.eventos.find(x=>x.id===b.dataset.id); await w(()=>S.db.doc("eventos/"+b.dataset.id).delete()); toast(e && e.repite && e.repite!=="no" ? "Evento quitado, con todas sus repeticiones." : "Evento quitado."); return; }
    case "ev-ok": case "ev-no": await w(()=>S.db.doc("eventos/"+b.dataset.id).update({estado: a==="ev-ok" ? "aprobado" : "rechazado", revisadoPor:S.session.uid})); toast(a==="ev-ok" ? "Evento aprobado: ya aparece en el calendario." : "Propuesta rechazada."); return;
    case "pf-luego": S.perfilAplazado = true; break;
    case "pf-save": {
      const u = resById(S.session.uid), [m0,d0] = (u.cumple||"-").split("-");
      const anio = Number(draft("pf_anio", u.anioNac?String(u.anioNac):""));
      const dia = Number(draft("pf_dia", d0?String(Number(d0)):"")), mes = Number(draft("pf_mes", m0?String(Number(m0)):"")), gustos = String(draft("pf_gustos", u.gustos||"")).trim().slice(0,1000);
      if (!dia || !mes || !anio){ toast("Indica el día, el mes y el año de tu nacimiento."); return; }
      if (dia===29 && mes===2 && !((anio%4===0 && anio%100!==0) || anio%400===0)){ toast(anio+" no fue bisiesto: no tuvo 29 de febrero."); return; }
      const maxDia = [31,29,31,30,31,30,31,31,30,31,30,31][mes-1];
      if (dia > maxDia){ toast("Ese día no existe en "+MESES[mes-1]+"."); return; }
      if (!gustos){ toast("Escribe al menos algo que te guste."); return; }
      const cumple = String(mes).padStart(2,"0")+"-"+String(dia).padStart(2,"0");
      await w(()=>S.db.doc("privados/"+u.id).update({cumple, anioNac:anio, gustos, gustosTs:Date.now()}));
      await w(()=>S.db.doc("nombres/"+u.id).update({cumple}));
      delete S.drafts.pf_dia; delete S.drafts.pf_mes; delete S.drafts.pf_anio; delete S.drafts.pf_gustos; S.perfilAplazado = false;
      toast("Datos guardados."); break;
    }
    case "pedir-gustos": {
      const r = resById(b.dataset.id); if (!r) return;
      await w(()=>S.db.doc("privados/"+r.id).update({pedirGustos:Date.now()}));
      toast("Se ha pedido a "+nombreVis(r)+" que actualice sus gustos."); break;
    }
    case "res-new": S.editRes="new"; Object.assign(S.drafts,{rf_nombre:"", rf_ini:"", rf_usuario:"", rf_regimen:"", rf_regen:{}, rf_rol:"residente", rf_com:false, rf_pin:String(Math.floor(100000+Math.random()*900000))}); break;
    case "res-edit": { const r=resById(b.dataset.id); S.editRes=r.id; Object.assign(S.drafts,{rf_nombre:r.nombre||"", rf_ini:r.iniciales||"", rf_usuario:r.usuario||"", rf_regimen:r.regimen||"", rf_regen:{...(r.regimenEn||{})}, rf_rol:rolDe(r), rf_com:r.comensal===true, rf_newpw:""}); break; }
    case "rf-rol": S.drafts.rf_rol=v; break;
    case "rf-com": S.drafts.rf_com = v==="true"; break;
    case "res-cancel": S.editRes=null; break;
    case "res-save": {
      const nombre=String(draft("rf_nombre")).trim(), usuario=normU(draft("rf_usuario")), rol=draft("rf_rol","residente"), nuevo = S.editRes==="new";
      const comensal = rol==="residente" || draft("rf_com",false)===true, pw = String(draft("rf_pin"));
      if (!nombre){ toast("Escribe el nombre."); return; }
      if (!/^[a-z0-9._-]{2,30}$/.test(usuario)){ toast("El usuario solo puede tener letras sin tildes, números, punto o guion."); return; }
      if (nuevo && pw.length<6){ toast("La contraseña inicial debe tener al menos 6 caracteres."); return; }
      const id = nuevo ? newId("u") : S.editRes, prev = resById(id);
      if (S.residentes.some(r=>r.id!==id && normU(r.usuario)===usuario)){ toast("Ese usuario ya existe. Elige otro."); return; }
      if (id===S.session.uid && rol!=="admin"){ toast("No puedes quitarte a ti mismo el perfil de administrador."); return; }
      const meU = resById(S.session.uid);
      if ((rol==="admin" || (prev && rolDe(prev)==="admin")) && id!==S.session.uid && !puedeGestionarAdmins(meU)){ toast("Solo el administrador principal puede gestionar administradores."); return; }
      if (prev && esTitular(prev) && rol!=="admin"){ toast("El titular siempre es administrador."); return; }
      const pub = {rol, comensal, iniciales: String(draft("rf_ini")).trim().toUpperCase().slice(0,6) || inicialesDe(nombre), activo: prev ? prev.activo!==false : true};
      const regimen = comensal ? String(draft("rf_regimen")).trim().slice(0,120) : "";
      const regimenEn = {}; SERV_REG.forEach(([k])=>{ regimenEn[k] = (draft("rf_regen",{})||{})[k]!==false; });
      S.entrando=true; render();
      try {
        if (nuevo){
          const ex = await S.db.doc("logins/"+usuario).get();
          if (ex.exists){ toast("Ese usuario ya existe. Elige otro."); S.entrando=false; render(); return; }
          const sa = authSecundaria(), email = emailNuevo(usuario), cred = await createUserWithEmailAndPassword(sa, email, pw);
          await signOut(sa);
          const b = writeBatch(fs);
          b.set(fdoc(fs,"usuarios/"+id), pub);
          b.set(fdoc(fs,"nombres/"+id), {nombre, usuario});
          b.set(fdoc(fs,"privados/"+id), {regimen, regimenEn, authUid:cred.user.uid});
          b.set(fdoc(fs,"cuentas/"+cred.user.uid), {perfil:id});
          b.set(fdoc(fs,"logins/"+usuario), {email, perfil:id});
          await b.commit();
          toast("Usuario creado. Contraseña inicial: "+pw);
        } else {
          const b = writeBatch(fs);
          b.update(fdoc(fs,"usuarios/"+id), {...pub, nombre:deleteField(), usuario:deleteField()});
          b.set(fdoc(fs,"nombres/"+id), {nombre, usuario}, {merge:true});
          b.update(fdoc(fs,"privados/"+id), {regimen, regimenEn});
          if (normU(prev.usuario)!==usuario){
            const ex = await S.db.doc("logins/"+usuario).get();
            if (ex.exists){ toast("Ese usuario ya existe. Elige otro."); S.entrando=false; render(); return; }
            const old = await S.db.doc("logins/"+normU(prev.usuario)).get();
            if (old.exists){ b.set(fdoc(fs,"logins/"+usuario), old.data()); b.delete(fdoc(fs,"logins/"+normU(prev.usuario))); }
          }
          await b.commit();
          toast("Usuario guardado.");
        }
        S.editRes=null;
      } catch(e){ console.error(e); toast(e.code==="auth/email-already-in-use" ? "Ese usuario ya existe." : "No se ha podido guardar ("+(e.code||e.message)+")."); }
      S.entrando=false; break;
    }
    case "res-reset": {
      const r = resById(S.editRes), pw = String(draft("rf_newpw"));
      if (!r) return;
      if (pw.length<6){ toast("La nueva contraseña debe tener al menos 6 caracteres."); return; }
      if (rolDe(r)==="admin" && !puedeGestionarAdmins(resById(S.session.uid))){ toast("Solo el administrador principal puede hacerlo con otro administrador."); return; }
      S.entrando=true; render();
      try {
        const sa = authSecundaria(), u = normU(r.usuario), email = emailNuevo(u), cred = await createUserWithEmailAndPassword(sa, email, pw);
        await signOut(sa);
        const b = writeBatch(fs);
        b.set(fdoc(fs,"cuentas/"+cred.user.uid), {perfil:r.id});
        b.set(fdoc(fs,"logins/"+u), {email, perfil:r.id});
        b.update(fdoc(fs,"privados/"+r.id), {authUid:cred.user.uid});
        if (r.authUid) b.delete(fdoc(fs,"cuentas/"+r.authUid));
        await b.commit();
        delete S.drafts.rf_newpw; toast("Contraseña restablecida. Nueva contraseña: "+pw);
      } catch(e){ console.error(e); toast("No se ha podido restablecer ("+(e.code||e.message)+")."); }
      S.entrando=false; break;
    }
    case "res-del-ask": S.drafts.delId = b.dataset.id; break;
    case "res-del-no": delete S.drafts.delId; break;
    case "res-del": {
      const r = resById(b.dataset.id), me = resById(S.session.uid);
      if (!r || r.id===S.session.uid || esTitular(r)) return;
      if (rolDe(r)==="admin" && !puedeGestionarAdmins(me)){ toast("Solo el administrador principal puede eliminar administradores."); return; }
      S.entrando = true; delete S.drafts.delId; render();
      try {
        const refs = [];
        const busca = async (col, campo) => { const q = await getDocs(query(fcol(fs, col), fwhere(campo, "==", r.id))); q.docs.forEach(d=>refs.push(d.ref)); };
        await busca("pedidos","residente"); await busca("wordle","uid"); await busca("consultas","autor");
        refs.push(fdoc(fs,"plantillas/"+r.id));
        if (r.usuario) refs.push(fdoc(fs,"logins/"+normU(r.usuario)));
        if (r.authUid) refs.push(fdoc(fs,"cuentas/"+r.authUid));
        refs.push(fdoc(fs,"privados/"+r.id), fdoc(fs,"nombres/"+r.id));
        for (let i=0;i<refs.length;i+=400){ const bt = writeBatch(fs); refs.slice(i,i+400).forEach(x=>bt.delete(x)); await bt.commit(); }
        await S.db.doc("usuarios/"+r.id).delete();
        toast((r.nombre||"El usuario")+" se ha eliminado con todos sus datos.");
      } catch(e){ console.error(e); toast("No se ha podido eliminar ("+(e.code||e.message)+")."); }
      S.entrando = false; break;
    }
    case "res-toggle": { const r=resById(b.dataset.id); if (r.id===S.session.uid || esTitular(r)) return;
      if (rolDe(r)==="admin" && !puedeGestionarAdmins(resById(S.session.uid))) return; await w(()=>S.db.doc("usuarios/"+r.id).update({activo: r.activo===false})); return; }
    case "dl-uid": S.drafts.dl_uid = v; break;
    case "tr-uid": S.drafts.tr_uid = v; S.drafts.tr_confirm = false; break;
    case "tr-ask": S.drafts.tr_confirm = true; break;
    case "tr-cancel": S.drafts.tr_confirm = false; break;
    case "tr-do": {
      const me=resById(S.session.uid), nuevo=resById(draft("tr_uid",""));
      if (!esTitular(me) || !nuevo || rolDe(nuevo)!=="admin") return;
      const c2 = {...S.config, principal:nuevo.id}; delete c2.delegacion;
      await w(()=>S.db.doc("config/general").set(c2));
      S.drafts.tr_uid=""; S.drafts.tr_confirm=false; toast(nuevo.nombre+" es ahora el administrador principal."); break;
    }
    case "dl-save": {
      if (!esTitular(resById(S.session.uid))) return;
      const uid=draft("dl_uid",""), desde=draft("dl_desde",today()), hasta=draft("dl_hasta",addDays(today(),6));
      if (!uid){ toast("Elige en quién delegas."); return; }
      if (!desde || !hasta || hasta<desde || hasta<today()){ toast("Revisa las fechas: el final no puede ser anterior al inicio ni a hoy."); return; }
      const desdeMs = parse(desde).getTime(), hastaMs = parse(addDays(hasta,1)).getTime()-1;
      await w(()=>S.db.doc("config/general").update({delegacion:{uid, desde, hasta, desdeMs, hastaMs}}));
      toast("Delegación guardada."); break;
    }
    case "dl-clear": {
      if (!esTitular(resById(S.session.uid))) return;
      const c3 = {...S.config}; delete c3.delegacion;
      await w(()=>S.db.doc("config/general").set(c3));
      toast("Delegación anulada."); break;
    }
    case "cfg-save": {
      const horasDia = {};
      for (let k=0;k<7;k++){ const h = String(draft("cf_h"+k, horaSemana(k))); if (!/^\d{2}:\d{2}$/.test(h)){ toast("Revisa la hora del "+DIAS[k].toLowerCase()+"."); return; } horasDia[k] = h; }
      const todas = [...Object.values(horasDia)].sort(), horaMaxSemana = todas[todas.length-1];
      await w(()=>S.db.doc("config/general").update({horasDia, horaMaxSemana, horaCierre: horasDia[0], horaCierreFinde: horasDia[5]}));
      for (let k=0;k<7;k++) delete S.drafts["cf_h"+k];
      toast("Horas guardadas."); break;
    }
    case "exc-add": {
      const f = String(draft("exc_f", today())), h = String(draft("exc_h","11:00"));
      if (!/^\d{4}-\d{2}-\d{2}$/.test(f) || f<today()){ toast("Elige un día de hoy en adelante."); return; }
      if (!/^\d{2}:\d{2}$/.test(h)){ toast("Indica la hora."); return; }
      const ex = Object.fromEntries(Object.entries((S.config||{}).excepciones||{}).filter(([d])=>d>=today()));
      ex[f] = h;
      await w(()=>S.db.doc("config/general").update({excepciones: ex}));
      toast("Día especial guardado: el "+fmtLong(f).toLowerCase()+" se podrá apuntar hasta las "+h+"."); break;
    }
    case "exc-del": {
      const ex = Object.fromEntries(Object.entries((S.config||{}).excepciones||{}).filter(([d])=>d>=today() && d!==v));
      await w(()=>S.db.doc("config/general").update({excepciones: ex}));
      toast("Día especial quitado."); break;
    }
  }
  render();
}
render();
</script>
</body>
</html>
